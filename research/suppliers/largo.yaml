## Rental fallback strategy

When equipment breaks or is over-capacity:
- **United Rentals** (Tampa) — full commercial fleet, daily/weekly rates.
- **Sunbelt Rentals** — similar.
- **Home Depot Tool Rental** — homeowner-grade, cheaper but slower availability.
- **Cost per rental day:** zero-turn mower ~$250-400/day; trailer ~$50-100/day.

**Operational rule:** If a job is scheduled and primary equipment is down, rent before rescheduling. Customer experience > equipment CAPEX payback.

