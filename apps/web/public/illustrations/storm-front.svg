<?xml version="1.0" encoding="UTF-8"?>
<!--
  storm-front.svg — Hurricane-mode scene for ServiceBento cardHurricane ribbon.
  Hand-drawn storm cell with wind streaks, palm bowing, and lightning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — storm front with bowed palm and lightning">
  <title>Storm front — hurricane mode</title>

  <!-- Sand sky (turned ominous, warm-brown haze) -->
  <rect width="600" height="400" fill="#5C4A3A" opacity="0.25"/>
  <rect width="600" height="400" fill="#1A1F1B" opacity="0.35"/>

  <!-- Storm clouds (organic, layered) -->
  <g fill="#1A1F1B" opacity="0.85">
    <path d="M 0 80 Q 80 60 160 90 Q 240 70 320 100 Q 400 80 480 110 Q 540 95 600 120 L 600 0 L 0 0 Z"/>
    <path d="M 0 140 Q 100 130 200 150 Q 300 135 400 160 Q 500 145 600 170 L 600 100 Q 540 95 480 110 Q 400 80 320 100 Q 240 70 160 90 Q 80 60 0 80 Z" opacity="0.7"/>
  </g>

  <!-- Lightning bolt (jagged, yellow-orange) -->
  <path d="M 340 0 L 300 110 L 330 110 L 290 200 L 360 90 L 330 90 L 360 0 Z"
        fill="#E8B65A" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Wind streaks (long, horizontal) -->
  <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 0 220 Q 100 215 200 222 Q 300 218 400 224"/>
    <path d="M 100 245 Q 200 240 300 248 Q 400 244 500 250"/>
    <path d="M 50 270 Q 150 265 250 272 Q 350 268 450 275"/>
    <path d="M 200 295 Q 300 290 400 298 Q 500 294 600 300"/>
  </g>

  <!-- Palm tree (bowing right, in the wind) -->
  <g transform="translate(180, 320)">
    <!-- Trunk (curved) -->
    <path d="M 0 0 Q -10 -60 5 -120 Q 20 -160 50 -180"
          fill="none" stroke="#5C4A3A" stroke-width="10" stroke-linecap="round"/>
    <!-- Trunk segments (texture rings) -->
    <g stroke="#1A1F1B" stroke-width="1" opacity="0.4">
      <line x1="-8" y1="-30" x2="2" y2="-30"/>
      <line x1="-5" y1="-60" x2="8" y2="-60"/>
      <line x1="0" y1="-90" x2="14" y2="-90"/>
      <line x1="8" y1="-120" x2="24" y2="-120"/>
      <line x1="20" y1="-150" x2="38" y2="-150"/>
    </g>
    <!-- Fronds (sweeping right, 6 leaves) -->
    <g stroke="#1F4E2C" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 50 -180 Q 90 -190 130 -200"/>
      <path d="M 50 -180 Q 100 -175 150 -170"/>
      <path d="M 50 -180 Q 95 -200 140 -220"/>
      <path d="M 50 -180 Q 80 -200 110 -240"/>
      <path d="M 50 -180 Q 60 -210 70 -250"/>
      <path d="M 50 -180 Q 40 -200 30 -240"/>
    </g>
    <!-- Coconut cluster -->
    <circle cx="50" cy="-180" r="5" fill="#5C4A3A" stroke="#1A1F1B" stroke-width="1"/>
    <circle cx="56" cy="-176" r="4" fill="#5C4A3A" stroke="#1A1F1B" stroke-width="1"/>
  </g>

  <!-- A second palm in foreground, also bowing -->
  <g transform="translate(420, 380)">
    <path d="M 0 0 Q 10 -50 30 -100 Q 60 -130 100 -140"
          fill="none" stroke="#5C4A3A" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#1F4E2C" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 100 -140 Q 140 -148 180 -150"/>
      <path d="M 100 -140 Q 140 -130 180 -120"/>
      <path d="M 100 -140 Q 130 -160 160 -180"/>
      <path d="M 100 -140 Q 110 -170 110 -210"/>
    </g>
    <circle cx="100" cy="-140" r="4" fill="#5C4A3A"/>
  </g>

  <!-- Sand visible beneath storm -->
  <path d="M 0 400 L 0 360 Q 100 350 200 360 Q 300 350 400 365 Q 500 355 600 370 L 600 400 Z"
        fill="#F4E8D0" opacity="0.7"/>
</svg>