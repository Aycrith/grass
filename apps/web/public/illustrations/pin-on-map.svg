<?xml version="1.0" encoding="UTF-8"?>
<!--
  pin-on-map.svg — AreaHero decoration (same anchor for all 6 ZIPs).
  Hand-drawn map pin over a sketchy street grid.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — map pin dropped on a street grid">
  <title>Map pin — area marker</title>

  <!-- Sand background -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Sketchy street grid -->
  <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round" opacity="0.18" fill="none">
    <!-- Horizontal streets -->
    <line x1="40" y1="100" x2="560" y2="100"/>
    <line x1="40" y1="160" x2="560" y2="160"/>
    <line x1="40" y1="220" x2="560" y2="220"/>
    <line x1="40" y1="280" x2="560" y2="280"/>
    <line x1="40" y1="340" x2="560" y2="340"/>
    <!-- Vertical streets -->
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="220" y1="40" x2="220" y2="360"/>
    <line x1="320" y1="40" x2="320" y2="360"/>
    <line x1="420" y1="40" x2="420" y2="360"/>
    <line x1="520" y1="40" x2="520" y2="360"/>
  </g>

  <!-- 3 small "neighbor" pins (gray, muted) -->
  <g fill="#8FA89B" opacity="0.7">
    <path d="M 150 140 C 150 130, 162 130, 162 140 C 162 152, 156 158, 156 158 C 156 158, 150 152, 150 140 Z"/>
    <circle cx="156" cy="140" r="3" fill="#F4E8D0"/>
    <path d="M 460 240 C 460 230, 472 230, 472 240 C 472 252, 466 258, 466 258 C 466 258, 460 252, 460 240 Z"/>
    <circle cx="466" cy="240" r="3" fill="#F4E8D0"/>
    <path d="M 100 300 C 100 290, 112 290, 112 300 C 112 312, 106 318, 106 318 C 106 318, 100 312, 100 300 Z"/>
    <circle cx="106" cy="300" r="3" fill="#F4E8D0"/>
  </g>

  <!-- Big "you are here" pin (centered, clay accent) -->
  <g transform="translate(300, 200)">
    <!-- Pin shadow -->
    <ellipse cx="0" cy="100" rx="22" ry="6" fill="#1A1F1B" opacity="0.18"/>
    <!-- Pin body -->
    <path d="M 0 -50 C 28 -50, 36 -22, 36 0 C 36 24, 14 56, 0 80 C -14 56, -36 24, -36 0 C -36 -22, -28 -50, 0 -50 Z"
          fill="#B5651D" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Pin center hole -->
    <circle r="12" fill="#F4E8D0"/>
    <circle r="6" fill="#1A1F1B"/>
  </g>
</svg>