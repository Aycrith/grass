# Tier B — Painted gouache (Scene 2 BG)
# ============================================================
- id: scene2-frames
  tier: B
  kind: image
  format: webp
  size_bytes: ~32400
  dimensions: 1240x680
  source: |
    Hand-painted gouache VEO render — a Florida ranch house with
    palms, sun, mowed lawn, birdbath. Originally extracted via
    scripts/prep-scene2-frames.py at crop=1240:680:20:20 from
    Hand-painted_gouache_illustratio._202607171636.mp4.
    See research/grasscontent/REPORT-source-comparison.md
    (D-0048) for the variant-selection rationale.
  license: veo-v3
  status: active
  used_by:
    - apps/web/src/components/sections/SecondScene.tsx
  files:
    - apps/web/public/hero/layers/v2/scene2-01.webp
    - apps/web/public/hero/layers/v2/scene2-02.webp
    - apps/web/public/hero/layers/v2/scene2-03.webp
    - apps/web/public/hero/layers/v2/scene2-04.webp
    - apps/web/public/hero/layers/v2/scene2-05.webp
    - apps/web/public/hero/layers/v2/scene2-06.webp
  notes: |
    6 frames, 10s CSS-step cycle. The painted frames are NEAR-
    IDENTICAL — only the sun + cloud positions shift subtly.
    Cycle reads as meditative hand-painted stillness, not a
    flipbook. Cadence: 4.0s per frame (slower than the
    micro-loops because scene 2 is the resting state, not
    the activity).

