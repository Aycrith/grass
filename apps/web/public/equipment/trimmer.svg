<?xml version="1.0" encoding="UTF-8"?>
<!--
  String trimmer equipment illustration. Battery-powered straight-shaft.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Battery string trimmer">
  <title>Trimmer</title>

  <rect width="400" height="300" fill="#F4E8D0"/>

  <rect y="220" width="400" height="80" fill="#2D5A3D"/>
  <rect y="240" width="400" height="20" fill="#3A6B45"/>

  <!-- Hedge row being trimmed -->
  <g fill="#3A6B45">
    <rect x="0" y="160" width="400" height="60"/>
    <circle cx="40" cy="160" r="30"/>
    <circle cx="120" cy="160" r="34"/>
    <circle cx="200" cy="160" r="32"/>
    <circle cx="280" cy="160" r="34"/>
    <circle cx="360" cy="160" r="32"/>
  </g>
  <rect y="218" width="400" height="4" fill="#1F4E2C"/>

  <!-- Trimmer tool -->
  <g transform="translate(180 40)">
    <rect x="-30" y="0" width="60" height="80" rx="10" fill="#1A1F1B"/>
    <rect x="-22" y="10" width="44" height="60" rx="4" fill="#2D5A3D"/>
    <rect x="-46" y="20" width="20" height="40" rx="6" fill="#B5651D"/>
    <line x1="0" y1="80" x2="0" y2="180"
          stroke="#1A1F1B" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="184" rx="32" ry="10" fill="#1A1F1B"/>
    <line x1="-26" y1="180" x2="-26" y2="200"
          stroke="#1A1F1B" stroke-width="4"/>
    <line x1="26" y1="180" x2="26" y2="200"
          stroke="#1A1F1B" stroke-width="4"/>
    <g stroke="#E8B65A" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -30 200 Q -20 220 -40 230"/>
      <path d="M 30 200 Q 20 220 40 230"/>
    </g>
    <g fill="#5C8A4E">
      <ellipse cx="-50" cy="220" rx="6" ry="2" transform="rotate(20 -50 220)"/>
      <ellipse cx="-40" cy="232" rx="6" ry="2" transform="rotate(-30 -40 232)"/>
      <ellipse cx="40" cy="220" rx="6" ry="2" transform="rotate(-20 40 220)"/>
      <ellipse cx="50" cy="232" rx="6" ry="2" transform="rotate(30 50 232)"/>
    </g>
  </g>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.7">
    <text x="20" y="36" font-size="14" font-weight="700" letter-spacing="2">TRIMMER</text>
  </g>
</svg>