name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"

jobs:
  # -----------------------------------------------------------------
  # 1. Lint — biome (TS/JS) + markdownlint (governance docs)
  # -----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      - name: Markdownlint governance docs
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md

  # -----------------------------------------------------------------
  # 2. Typecheck — strict TS via tsc
  # -----------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript strict
        run: bun run typecheck

  # -----------------------------------------------------------------
  # 3. Agent spec lint — charter compliance
  # -----------------------------------------------------------------
  agent-spec:
    name: Agent Spec Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint agent specs
        run: bun run test:agents

  # -----------------------------------------------------------------
  # 4. Capability registry lint
  # -----------------------------------------------------------------
  capability-registry:
    name: Capability Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint capability registry
        run: bun run test:capabilities

  # -----------------------------------------------------------------
  # 5. Secret scan — gitleaks
  # -----------------------------------------------------------------
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------
  # 6. OSV supply-chain scan (runs when bun.lock exists)
  # -----------------------------------------------------------------
  supply-chain:
    name: Supply-Chain Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # non-fatal until first lockfile lands
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: OSV scan
        uses: google/osv-scanner-action@v2
        with:
          lockfile: bun.lock
        continue-on-error: true

  # -----------------------------------------------------------------
  # 7. Asset weight budget — every raster under apps/web/public ≤ 300 KB
  #    (Plan §4 WP4 / PRD-05 §10). Transitions from no-op (transition
  #    state, no webps yet) to hard guard once WP3 lands 19 webps.
  # -----------------------------------------------------------------
  asset-weight:
    name: Asset Weight Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check raster weight budget
        run: bun run apps/comfyui/scripts/check-weight.mjs

  # -----------------------------------------------------------------
  # 8. Image references — every <Image src="/..."> / <img src="/...">
  #    in apps/web/src resolves to a real file under apps/web/public,
  #    and every services.{slug}.imageSlot in lib/content.ts does too.
  #    (Plan §4 WP4 / PRD-05 §10).
  # -----------------------------------------------------------------
  references:
    name: Image References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify image references resolve
        run: bun run apps/comfyui/scripts/verify-references.mjs

  # -----------------------------------------------------------------
  # 9. Lighthouse CI — PR budget guard.
  #    Runs 2 routes (`/` + `/services/mowing`) on desktop + mobile
  #    presets against the production build served on port 3000.
  #    Failures post a PR comment with delta + fail open above the
  #    budget. The full 6-route × 2-viewport sweep lives in the
  #    nightly cron at .github/workflows/lighthouse-nightly.yml.
  #    (Plan §3 Phase C / PRD-00 §4).
  # -----------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI (PR budget guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (production)
        working-directory: apps/web
        run: bun run build

      - name: Start production server
        working-directory: apps/web
        run: |
          nohup bun run start > /tmp/wp5-web.log 2>&1 &
          echo "PID=$!"

      - name: Wait for server ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in 60s"
          cat /tmp/wp5-web.log
          exit 1

      - name: Lighthouse CI — desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true

      - name: Lighthouse CI — mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.mobile.cjs
          uploadArtifacts: true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-server-log
          path: /tmp/wp5-web.log