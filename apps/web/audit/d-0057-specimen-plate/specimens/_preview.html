  <div style="display: inline-block; margin: 16px; padding: 16px; background: #fff;">

  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

    <circle cx="170" cy="160" r="85" />

  <!-- St. Augustine seedhead (flat scaly spike) -->
  <g transform="translate(170 86)">
    <!-- Spike outline (rounded teardrop) -->
    <path d="M -2.5 -2 Q -3 -10 -2.5 -20 Q -1 -32 0 -40 Q 1 -32 2.5 -20 Q 3 -10 2.5 -2 Z"

    <line x1="-2" y1="-20" x2="2" y2="-20" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />
    <line x1="-1.7" y1="-26" x2="1.7" y2="-26" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />
    <line x1="-1.4" y1="-32" x2="1.4" y2="-32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />

  <!-- 5 BROAD blades with ROUNDED tips (line art + very light olive wash) -->

  <g>
    <path d="M 170 220 Q 156 170 148 100 Q 146 90 152 88 Q 158 90 158 100 Q 162 170 170 220 Z"

    <!-- Veining (parallel lines down the blade) -->
    <line x1="153" y1="100" x2="166" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.55" />
    <line x1="155" y1="100" x2="168" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />

  </g>

  <!-- Blade 2: left-center, slight curve -->
  <g>
    <path d="M 170 220 Q 164 160 162 90 Q 162 80 168 78 Q 174 80 174 90 Q 172 160 170 220 Z"

    <line x1="176" y1="90" x2="176" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />

  <!-- Blade 4: right-center, slight curve -->

    <line x1="183" y1="95" x2="183" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
    <line x1="186" y1="95" x2="186" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />

    <line x1="187" y1="100" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.55" />
    <line x1="185" y1="100" x2="172" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
    <line x1="189" y1="105" x2="176" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.35" />
  </g>

  <!-- STOLONS (above-ground runners) — diagnostic for St. Augustine (no rhizomes) -->
  <!-- Left stolon, thick (St. Augustine stolons are THICK and visible) -->
  <path d="M 170 224 Q 130 232 90 244 Q 70 248 50 256"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="2.2" stroke-linecap="round" />
  <!-- Stolon nodes -->

  <circle cx="90" cy="244" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <!-- Right stolon -->
  <path d="M 170 224 Q 210 232 250 244 Q 270 248 290 256"

  <circle cx="210" cy="232" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="250" cy="244" r="2" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- Small root squiggles BELOW the soil line (stolons root down, no rhizomes) -->
  <path d="M 130 252 Q 132 258 128 264 Q 130 268 126 272" fill="none" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.5" opacity="0.5" />
  <path d="M 210 252 Q 212 258 208 264 Q 210 268 206 272" fill="none" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.5" opacity="0.5" />

  <!-- Corner stamp (clay) - top-left -->
  <g transform="translate(28 32) rotate(-3)" opacity="0.7">
    <rect x="0" y="0" width="50" height="22" fill="none" stroke="var(--ll-clay, #b5651d)" stroke-width="0.7" rx="2" />
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="var(--ll-clay, #b5651d)">FL-04</text>
  </g>

  <!-- Specimen tag (lower-right) -->
  <g transform="translate(170 276)">
    <rect x="0" y="0" width="160" height="50" fill="var(--ll-label-tan, #f0e6d0)" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />

    <text x="6" y="44" font-family="sans-serif" font-size="6" fill="var(--ll-sepia, #5a3e1f)" opacity="0.7">Largo FL · 2026-07-21</text>
  </g>
</svg>
</div>

  <div style="display: inline-block; margin: 16px; padding: 16px; background: #fff;">
    <div style="font-family: sans-serif; font-size: 14px; color: #333; margin-bottom: 8px;">Bermudagrass</div>

  <title>Bermudagrass — Cynodon dactylon</title>

  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

  <!-- Press rings -->
  <g opacity="0.08" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.3">
    <circle cx="170" cy="160" r="125" />
    <circle cx="170" cy="160" r="105" />
    <circle cx="170" cy="160" r="85" />
    <circle cx="170" cy="160" r="65" />

  <!-- Border -->
  <rect x="14" y="14" width="312" height="312" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" opacity="0.4" />

  <!-- BERMUDA SEEDHEAD: 3 finger-like spikes at the top (diagnostic) -->
  <g transform="translate(170 90)">
    <!-- Stalk to fork -->
    <line x1="0" y1="0" x2="0" y2="-6" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.6" stroke-linecap="round" />
    <!-- Spike 1 (left, angled) -->
    <g transform="rotate(-32)">
      <line x1="0" y1="-6" x2="0" y2="-32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.5">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
      </g>
    </g>
    <!-- Spike 2 (center, taller) -->
    <g>
      <line x1="0" y1="-6" x2="0" y2="-40" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.5">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
        <line x1="-0.5" y1="-30" x2="0.5" y2="-30" />
        <line x1="-0.4" y1="-34" x2="0.4" y2="-34" />
      </g>
    </g>
    <!-- Spike 3 (right, angled) -->
    <g transform="rotate(32)">
      <line x1="0" y1="-6" x2="0" y2="-30" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.5">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
      </g>
    </g>
  </g>

  <!-- 7 FINE blades with POINTED tips (line art + light wash) -->
  <!-- Blade 1: leftmost, leaning left -->
  <g>
    <path d="M 170 220 Q 156 170 148 110 L 146 102 L 150 100 L 152 110 Q 162 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="149" y1="110" x2="166" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 2: left -->
  <g>
    <path d="M 170 220 Q 162 160 160 100 L 159 90 L 162 88 L 164 100 Q 168 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="162" y1="100" x2="170" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 3: center-left -->
  <g>
    <path d="M 170 220 Q 168 150 166 80 L 165 70 L 168 68 L 170 80 Q 172 150 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="168" y1="80" x2="170" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 4: center-tallest (with seedhead) -->
  <g>
    <path d="M 170 220 Q 170 140 170 90 L 170 50 L 173 48 L 176 50 L 176 90 Q 174 140 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="173" y1="60" x2="173" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 5: center-right -->
  <g>
    <path d="M 170 220 Q 172 150 174 80 L 175 70 L 178 68 L 181 70 L 180 80 Q 178 150 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="178" y1="80" x2="178" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 6: right -->
  <g>
    <path d="M 170 220 Q 178 160 180 100 L 181 90 L 184 88 L 187 90 L 186 100 Q 182 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="184" y1="100" x2="178" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>
  <!-- Blade 7: rightmost, leaning right -->
  <g>
    <path d="M 170 220 Q 184 170 192 110 L 194 102 L 198 100 L 200 102 L 198 110 Q 188 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="196" y1="110" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55" />
  </g>

  <!-- BOTH stolons AND rhizomes (Bermuda's diagnostic feature) -->
  <!-- Stolons above soil (thin, wiry) -->
  <path d="M 170 220 Q 130 225 80 232 Q 60 236 40 240"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 170 220 Q 210 225 260 232 Q 280 236 300 240"

  <circle cx="125" cy="226" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="215" cy="226" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- Soil line -->
  <line x1="40" y1="245" x2="300" y2="245" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.6" />

  <!-- RHIZOMES below soil (Bermuda has these too — the second diagnostic feature) -->
  <path d="M 170 248 Q 130 254 90 260 Q 70 264 50 270"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 170 248 Q 210 254 250 260 Q 270 264 290 270"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="130" cy="254" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="210" cy="254" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="170" cy="248" r="1.6" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- Corner stamp -->
  <g transform="translate(28 32) rotate(-3)" opacity="0.7">
    <rect x="0" y="0" width="50" height="22" fill="none" stroke="var(--ll-clay, #b5651d)" stroke-width="0.7" rx="2" />
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="var(--ll-clay, #b5651d)">FL-04</text>
  </g>

  <!-- Specimen tag -->
  <g transform="translate(170 278)">
    <rect x="0" y="0" width="160" height="50" fill="var(--ll-label-tan, #f0e6d0)" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />

    <text x="6" y="24" font-family="sans-serif" font-size="7.5" fill="var(--ll-sepia, #5a3e1f)">Bermudagrass</text>
    <text x="6" y="34" font-family="sans-serif" font-size="6.5" fill="var(--ll-sepia, #5a3e1f)" opacity="0.85">1.0–2.0 in · 3–5 days · stolons + rhizomes</text>
    <text x="6" y="44" font-family="sans-serif" font-size="6" fill="var(--ll-sepia, #5a3e1f)" opacity="0.7">Largo FL · 2026-07-21</text>
  </g>
</svg>

  <div style="display: inline-block; margin: 16px; padding: 16px; background: #fff;">

  <title>Zoysiagrass — Zoysia spp.</title>

  <!-- Aged paper background -->
  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

  <!-- Press rings -->
  <g opacity="0.08" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.3">
    <circle cx="170" cy="160" r="125" />
    <circle cx="170" cy="160" r="105" />
    <circle cx="170" cy="160" r="85" />

  <!-- ZOYSIA SEEDHEAD: small terminal spike (less showy than Bermuda) -->

    <line x1="0" y1="0" x2="0" y2="-6" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
