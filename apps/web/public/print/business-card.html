<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Largo Lawn Business Card — Print-Ready (2-up)</title>
<style>
  @page {
    size: letter;
    margin: 0.5in;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .grid {
    width: 7.5in;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 3.5in 3.5in;
    gap: 0.25in 0.5in;
  }
  .card {
    width: 3.5in;
    height: 2in;
    background: #f7f1e3;
    border-radius: 0;
    box-sizing: border-box;
    padding: 0.18in 0.22in;
    position: relative;
    overflow: hidden;
  }
  /* front */
  .front {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .front .mark {
    width: 0.45in;
    height: 0.45in;
    background: #2f6b3d;
    color: #f7f1e3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 14pt;
    line-height: 1;
    margin-bottom: 0.06in;
  }
  .front .tagline {
    font-size: 6.5pt;
    font-weight: 600;
    color: #2f6b3d;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: 0.18in;
  }
  .front .wordmark {
    margin-top: auto;
    margin-bottom: auto;
    font-size: 24pt;
    font-weight: 900;
    color: #1a2f25;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  /* back */
  .back {
    background: #f7f1e3;
    padding: 0.18in 0.22in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .back .top {
    border-bottom: 0.012in solid #2f6b3d;
    padding-bottom: 0.06in;
    margin-bottom: 0.08in;
  }
  .back h2 {
    margin: 0 0 0.02in;
    font-size: 9pt;
    font-weight: 800;
    color: #2f6b3d;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
  }
  .back .services {
    font-size: 7pt;
    color: #1a2f25;
    line-height: 1.3;
  }
  .back .contact-block {
    font-size: 8.5pt;
    color: #1a2f25;
    line-height: 1.4;
  }
  .back .contact-block strong { font-weight: 700; }
  .back .footer {
    font-size: 5.5pt;
    color: #6a6a6a;
    text-align: center;
    border-top: 0.008in solid #d4c9aa;
    padding-top: 0.05in;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="grid">

  <!-- Front -->
  <div class="card front">
    <div class="mark">LL</div>
    <div class="tagline">YOUR NEIGHBOR'S LAWN MOWER</div>
    <div class="wordmark">Largo Lawn</div>
  </div>

  <!-- Back -->
  <div class="card back">
    <div class="top">
      <h2>YOUR NEIGHBORHOOD LAWN CARE</h2>
      <div class="services">Mowing · Edging · Mulching · Hedge Trim · Hurricane Prep</div>
    </div>
    <div class="contact-block">
      <strong>[Your first name]</strong><br/>
      (727) 555-0123<br/>
      hello@largolawn.pro<br/>
      largolawn.pro
    </div>
    <div class="footer">
      SERVING 33771 + 33770 · 33773 · 33774 · 33778 · 33756
    </div>
  </div>

</div>
</body>
</html>
