<?xml version="1.0" encoding="UTF-8"?>
<!--
  clock.svg — ScheduleTimeline day markers.
  Hand-drawn analog clock, 7 AM position, "operator up early" feeling.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Illustration — analog clock at seven o'clock">
  <title>Clock — schedule marker</title>

  <!-- Outer face -->
  <circle cx="100" cy="100" r="86" fill="#F4E8D0" stroke="#1A1F1B" stroke-width="3"/>

  <!-- Hour ticks (12, 3, 6, 9 emphasized) -->
  <g stroke="#1A1F1B" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="34" stroke-width="4"/>
    <line x1="100" y1="166" x2="100" y2="180" stroke-width="4"/>
    <line x1="20" y1="100" x2="34" y2="100" stroke-width="4"/>
    <line x1="166" y1="100" x2="180" y2="100" stroke-width="4"/>
  </g>
  <!-- Minor ticks -->
  <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="40" y1="40" x2="46" y2="46"/>
    <line x1="160" y1="40" x2="154" y2="46"/>
    <line x1="40" y1="160" x2="46" y2="154"/>
    <line x1="160" y1="160" x2="154" y2="154"/>
  </g>

  <!-- Hour hand (pointing at 7) -->
  <line x1="100" y1="100" x2="62" y2="138" stroke="#1A1F1B"
        stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand (pointing at 12) -->
  <line x1="100" y1="100" x2="100" y2="36" stroke="#B5651D"
        stroke-width="4" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="6" fill="#1A1F1B"/>
  <circle cx="100" cy="100" r="3" fill="#E8B65A"/>

  <!-- Sun arc (operator up early) -->
  <path d="M 30 100 A 70 70 0 0 1 100 30" fill="none"
        stroke="#E8B65A" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="3 5" opacity="0.7"/>
</svg>