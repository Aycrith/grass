# ===================================================================
# GRASS — Risk Register
# Charter principle: "Every irreversible decision must be documented."
# Charter principle: "Truth over convenience."
# Risks scored as: risk_score = likelihood (1-5) x impact (1-5).
# Review cadence: weekly (executive agent), full retro monthly.
# ===================================================================

schema_version: 0.1.0
last_updated: 2026-08-01
owner_agent: executive

methodology:
  likelihood: "1=remote, 2=unlikely, 3=possible, 4=likely, 5=near-certain"
  impact: "1=negligible, 2=minor, 3=moderate, 4=major, 5=catastrophic"
  risk_score: "likelihood x impact (1-25). >=12 = action this week."
  review_cadence_days: 7

risks:

  - risk_id: R-CHDRIFT-001
    title: "Charter drift: capability registry becomes paperwork tax"
    description: >
      "Every organizational capability must be registered" stops being a
      forcing function for capability-thinking and becomes an empty form
      agents skip or backfill. Tells: capabilities with status=active but no
      tests; capabilities with status=active but unknown owner; capability
      registry edit lag >7 days.
    likelihood: 4
    impact: 4
    risk_score: 16
    owner_agent: qa
    mitigation:
      - "Capability registration is a commit-time lint, not a doc."
      - "`scripts/lint-capabilities.ts` blocks merge on missing fields."
      - "Treat registration like a DB migration: atomic, build-blocking."
      - "Weekly `scripts/charter-compliance.ts` reports the gap."
    mitigation_link: "scripts/lint-capabilities.ts, scripts/charter-compliance.ts"
    detection_signal: "capabilities with no test reference for >14 days"
    review_date: 2026-07-17

  - risk_id: R-FLLIC-001
    title: "Florida licensing surprise mid-launch"
    description: >
      Discovering a license required for a service line on Day 30 that
      wasn't on the original licensing map. Examples: GI-BMP prerequisite
      for fertilizer license; FDACS Limited Commercial Fertilizer Applicator;
      PCCLB Irrigation System Specialty Contractor for irrigation work;
      workers' comp lapsing once first hire occurs.
    likelihood: 3
    impact: 5
    risk_score: 15
    owner_agent: research
    mitigation:
      - "Day 8 licensing map is the gate (research/regulatory/largo-licensing-map.yaml)."
      - "Service decomposition explicitly excludes fertilization / irrigation / pest until licenses held."
      - "Insurance minimums ($1M GL) before any field work."
      - "7% sales tax (state 6% + Pinellas 1% surtax) registration Day 1."
      - "Workers' comp corporate-officer exemption filing (solo founder)."
    mitigation_link: "research/regulatory/largo-licensing-map.yaml (TBD Day 8)"
    detection_signal: "service catalog change request from sales/ops without licensing check"
    review_date: 2026-07-17

  - risk_id: R-BURN-001
    title: "Solo-founder context burnout by Month 3"
    description: >
      Every agent decision still routes through the steward. Approvals,
      daily CEO-reviews, weekly retros, charter compliance checks, decision
      template entries — cumulative load becomes unsustainable as agents
      become more capable and decision volume grows.
    likelihood: 4
    impact: 4
    risk_score: 16
    owner_agent: executive
    mitigation:
      - "Authority limits in every agent spec (decides_without_human, escalates_when)."
      - "Approval-queue budget = 5/day max; when exceeded, tighten thresholds or escalate to ADR."
      - "Daily 30-min 'CEO review' blocked on calendar."
      - "Weekly postmortems (one short doc, don't stack)."
      - "Quarterly charter review including burnout signal check."
    mitigation_link: "agents/executive.md, all agent `Escalates` sections"
    detection_signal: "approval-queue >5/day for >3 consecutive days"
    review_date: 2026-07-17

  - risk_id: R-INFRA-001
    title: "Self-hosting/infra tax before PMF"
    description: >
      Tempted to self-host at $0 revenue because managed services feel
      expensive. Migrating prematurely when Vercel/Supabase bills grow
      consumes engineering bandwidth Mission 1 cannot afford. Charter's
      success metrics are not infra cost.
    likelihood: 3
    impact: 4
    risk_score: 12
    owner_agent: infrastructure
    mitigation:
      - "$200/mo infra ceiling is a charter rule through Month 6."
      - "When Supabase egress / Vercel bandwidth hits $400, write it to infra_debt/, don't migrate."
      - "Self-host only when MRR justifies dedicated infra person (Month 12+)."
      - "Jobber $39/mo replaces admin app until Month 6 (don't build admin first)."
    mitigation_link: "state/ledger.yaml → strategy_locked.infra_budget_ceiling_usd_per_month, agents/infrastructure.md"
    detection_signal: "infra bill >$200/mo for any week"
    review_date: 2026-07-17

  - risk_id: R-HURR-001
    title: "Hurricane season breaks scheduling + payment ops in Year 1"
    description: >
      Largo FL gets hurricanes June-November. Sustained winds >=30mph
      make outdoor work unsafe; named-storm conditions can pause
      scheduling for days. No-fault cancellation handling must be
      pre-registered, not improvised mid-storm. Insurance rider
      (business interruption + equipment flood/theft) must precede
      any field crew starting.
    likelihood: 4
    impact: 4
    risk_score: 16
    owner_agent: operations
    mitigation:
      - "Hurricane mode is a registered capability Day 1 (cap_hurricane_mode)."
      - "Hard rule: no outdoor work in named-storm conditions or sustained winds >=30mph."
      - "Auto-credit no-fault cancellations when hurricane mode triggers."
      - "1-month operating cash reserve before any field crew starts."
      - "Business interruption + equipment insurance rider before first crew."
    mitigation_link: "state/capability-registry.yaml → cap_hurricane_mode (reserved)"
    detection_signal: "NWS hurricane watch or warning for Pinellas County"
    review_date: 2026-07-17

  # ----------------------------------------------------------------
  # Pilot risks (added 2026-07-29 per D-0064 §7)
  # ----------------------------------------------------------------
  - risk_id: R-PILOT-001
    title: "Unprofitable CAC after first 14 days of paid-acquisition pilot"
    description: >
      Per D-0064: pilot runs on Google Search ads for pet-waste cleanup
      in the 6-ZIP service area. Profitability circuit-breaker pauses
      the campaign when CAC exceeds 12 weeks of gross profit per customer
      (~$138). Risk: early CAC reads above ceiling, indicating either
      targeting failure (wrong keywords/geo) or offer failure (no
      conversion at $7.50 first-cleanup price point).
    likelihood: 4
    impact: 4
    risk_score: 16
    owner_agent: marketing
    mitigation:
      - "Profitability circuit-breaker: pause campaign when CAC > $138/customer."
      - "Manual daily spend check; weekly CAC reconciliation."
      - "Pause campaign if <3 qualified leads by Day 7."
      - "Pause campaign if zero booked jobs by Day 14."
    mitigation_link: "governance/decisions/0064-paid-acquisition-pilot.md §6"
    detection_signal: "GA4/Google Ads CAC exceeds $138/customer at Day 7 or Day 14"
    review_date: 2026-08-29

  - risk_id: R-PILOT-002
    title: "Google new-account free credit not actually available"
    description: >
      Per D-0064: pilot assumes Google Search new-account $500 free
      credit. The credit amount is typical but not guaranteed. If the
      credit is denied or smaller, the pilot must operate on cash.
    likelihood: 3
    impact: 4
    risk_score: 12
    owner_agent: marketing
    mitigation:
      - "Treat credits as zero until claimed."
      - "Cap first-month spend at $0 until credit confirmation."
      - "If credit denied, request explicit steward approval before any cash spend."
    mitigation_link: "governance/decisions/0064-paid-acquisition-pilot.md §2"
    detection_signal: "Google Ads account shows no credit balance after 7 days of account creation"
    review_date: 2026-08-29

  - risk_id: R-PILOT-003
    title: "Steward cannot sustain 5-minute lead response SLA"
    description: >
      Per D-0064: pilot commits to 5-min response during business hours
      (Mon-Fri 7a-5p, Sat 8a-2p). Risk: solo founder is unavailable
      (meeting, off-grid, hurricane prep, sick) and leads go unanswered.
      Slow response destroys paid-lead conversion.
    likelihood: 3
    impact: 5
    risk_score: 15
    owner_agent: sales
    mitigation:
      - "Honest copy on landing page (5-min business hours, next-morning after hours)."
      - "Pause campaign during known unavailable windows."
      - "Auto-acknowledge SMS within 30 seconds regardless of personal-reply window."
      - "Steward calendar block during active hours."
    mitigation_link: "governance/decisions/0064-paid-acquisition-pilot.md §0.7"
    detection_signal: "Average lead response time exceeds 30 minutes for any 24-hour period"
    review_date: 2026-08-29

  - risk_id: R-PILOT-004
    title: "Pet-waste service turns out to be unviable (regulation, equipment, demand)"
    description: >
      Per D-0065: pet-waste is ratified as a Mission 1 service line for
      the pilot's duration. Risk: unanticipated regulation, equipment
      shortage, or zero demand surfaces after ads start.
    likelihood: 2
    impact: 4
    risk_score: 8
    owner_agent: operations
    mitigation:
      - "14-day early read; pause if no qualified leads by Day 7."
      - "Pilot accepts up to 5 concurrent customers before route density review."
      - "Capability reverts to status=reserved if pilot aborts pre-customer."
    mitigation_link: "governance/decisions/0065-pet-waste-service-ratification.md §7"
    detection_signal: "Zero qualified leads by Day 7 OR zero booked jobs by Day 14"
    review_date: 2026-08-29

  - risk_id: R-PILOT-005
    title: "Account-level monthly cap not honored by Google Ads (overspend >2x daily)"
    description: >
      Per D-0064: steward acknowledges Google Ads daily budgets are not
      hard caps and can overspend up to ~2x daily within a month. Risk:
      a high-traffic day triggers a >2x daily overrun, monthly bill
      exceeds steward's expected envelope.
    likelihood: 2
    impact: 4
    risk_score: 8
    owner_agent: marketing
    mitigation:
      - "Steward acknowledgement in writing (D-0064 §3.5)."
      - "Monthly account-level cap set in Google Ads UI as primary control."
      - "Reconciliation within 7 days of month end."
      - "Profitability circuit-breaker (R-PILOT-001) caps further overspend risk."
    mitigation_link: "governance/decisions/0064-paid-acquisition-pilot.md §3.5"
    detection_signal: "Google Ads UI shows monthly spend exceeding daily cap x 30 by more than 20%"
    review_date: 2026-08-29

  - risk_id: R-PILOT-006
    title: "Lead SLA collapse leads to zero qualified conversions"
    description: >
      Per D-0064: pilot conversion target is a booked cleanup. Risk:
      leads arrive, steward cannot respond in time, leads cool, no
      bookings. CAC calculated from spend without booked revenue
      looks unbounded.
    likelihood: 3
    impact: 4
    risk_score: 12
    owner_agent: sales
    mitigation:
      - "Auto-acknowledge SMS within 30 seconds regardless of personal-reply window."
      - "Steward calendar block during active hours."
      - "Pause campaign if average response time exceeds 30 minutes for any 24-hour period."
    mitigation_link: "governance/decisions/0064-paid-acquisition-pilot.md §7 (R-PILOT-003 mitigation)"
    detection_signal: "Booked-job conversion rate below 10% at Day 14"
    review_date: 2026-08-29

