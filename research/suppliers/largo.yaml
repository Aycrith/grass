| String trimmer (Stihl FS 91, Echo SRM-225) | In stock | In stock |
| Hedge trimmer (Stihl HS 56, Echo HC-2020) | In stock | In stock |
| Backpack blower (Stihl BR 600, Echo PB-8010) | In stock | 1-2 weeks |
| Edger (Stihl FC 91, Echo PE-225) | In stock | In stock |
| Truck (used, 1/2 ton pickup) | 1-2 weeks | 2-4 weeks |
| Trailer (open landscape, 12-16 ft) | 1-2 weeks | 1-3 weeks |

**Operational implication:** Equipment acquisition for Month 2 closed-beta launch must START by end of Week 1 of operations. Order mowers no later than Day 14 of operations to receive by Day 35.

