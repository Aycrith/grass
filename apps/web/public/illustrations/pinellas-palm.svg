<?xml version="1.0" encoding="UTF-8"?>
<!--
  pinellas-palm.svg — used in:
    - HeroCinematic right-column composition (on dark green stage)
    - OperatorStrip signature mark
    - PricingTiers header ornament
    - ServiceAreaStats watermark
    - SiteFooter brand mark

  Hand-drawn palm tree with coconuts and a soft sun behind.

  WP19 — removed the sand surface <rect>, the ground line, and the
  beach grass tufts. The illustration now paints cleanly against any
  background without needing per-context mask-image: radial-gradient()
  workarounds. The dark palm silhouette and the soft sun multiply
  nicely against the deep-green hero stage, and on the lighter
  sections (OperatorStrip, PricingTiers, SiteFooter, ServiceAreaStats)
  the palm reads as a clean ink-style mark on its host surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — Florida palm tree with sun behind">
  <title>Pinellas palm</title>

  <!-- Sun (large, behind palm) -->
  <circle cx="380" cy="140" r="80" fill="#E8B65A" opacity="0.4"/>
  <circle cx="380" cy="140" r="60" fill="#E8B65A" opacity="0.6"/>

  <!-- Sun rays -->
  <g stroke="#E8B65A" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="380" y1="40" x2="380" y2="60"/>
    <line x1="380" y1="220" x2="380" y2="240"/>
    <line x1="280" y1="140" x2="300" y2="140"/>
    <line x1="460" y1="140" x2="480" y2="140"/>
    <line x1="310" y1="70" x2="324" y2="84"/>
    <line x1="436" y1="196" x2="450" y2="210"/>
    <line x1="310" y1="210" x2="324" y2="196"/>
    <line x1="436" y1="84" x2="450" y2="70"/>
  </g>

  <!-- Palm trunk (slight curve, textured with rings) -->
  <g>
    <path d="M 270 380 Q 260 280 250 200 Q 240 130 230 80"
          fill="none" stroke="#5C4A3A" stroke-width="22" stroke-linecap="round"/>
    <!-- Texture rings (suggesting palm scales) -->
    <g stroke="#1A1F1B" stroke-width="1.5" opacity="0.4" fill="none">
      <path d="M 254 360 Q 268 358 282 360"/>
      <path d="M 254 320 Q 268 318 282 320"/>
      <path d="M 252 280 Q 266 278 280 280"/>
      <path d="M 250 240 Q 264 238 278 240"/>
      <path d="M 248 200 Q 262 198 276 200"/>
      <path d="M 246 160 Q 260 158 274 160"/>
      <path d="M 244 120 Q 258 118 272 120"/>
    </g>
  </g>

  <!-- Fronds (8, sweeping outward from crown) -->
  <g stroke="#1F4E2C" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 230 80 Q 180 60 120 60"/>
    <path d="M 230 80 Q 170 80 110 100"/>
    <path d="M 230 80 Q 170 100 120 130"/>
    <path d="M 230 80 Q 180 100 150 150"/>
    <path d="M 230 80 Q 230 30 240 -20"/>
    <path d="M 230 80 Q 270 30 320 0"/>
    <path d="M 230 80 Q 290 60 360 50"/>
    <path d="M 230 80 Q 300 90 360 110"/>
    <path d="M 230 80 Q 290 120 340 160"/>
  </g>

  <!-- Frond detail lines (leaflets) -->
  <g stroke="#1F4E2C" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="180" y1="65" x2="175" y2="55"/>
    <line x1="160" y1="70" x2="155" y2="60"/>
    <line x1="140" y1="80" x2="135" y2="70"/>
    <line x1="190" y1="85" x2="185" y2="75"/>
    <line x1="170" y1="95" x2="165" y2="85"/>
    <line x1="290" y1="65" x2="285" y2="55"/>
    <line x1="320" y1="55" x2="320" y2="45"/>
    <line x1="310" y1="80" x2="305" y2="70"/>
  </g>

  <!-- Coconut cluster -->
  <g>
    <circle cx="220" cy="90" r="6" fill="#5C4A3A" stroke="#1A1F1B" stroke-width="1.5"/>
    <circle cx="228" cy="84" r="5" fill="#5C4A3A" stroke="#1A1F1B" stroke-width="1.5"/>
    <circle cx="234" cy="92" r="5" fill="#5C4A3A" stroke="#1A1F1B" stroke-width="1.5"/>
  </g>
</svg>