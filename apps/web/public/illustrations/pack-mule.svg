<?xml version="1.0" encoding="UTF-8"?>
<!--
  pack-mule.svg — EmptyState decoration.
  Hand-drawn pack mule with two panniers, looking patient.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — patient pack mule with panniers">
  <title>Pack mule — empty state</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Ground line -->
  <line x1="40" y1="320" x2="560" y2="320" stroke="#5C4A3A"
        stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Body (oval) -->
  <ellipse cx="300" cy="240" rx="120" ry="50" fill="#5C4A3A"
           stroke="#1A1F1B" stroke-width="3"/>

  <!-- Back stripe (mule markings) -->
  <path d="M 220 200 Q 300 195 380 200" fill="none" stroke="#1A1F1B"
        stroke-width="3" stroke-linecap="round"/>

  <!-- Pannier (left side, loaded) -->
  <rect x="200" y="190" width="50" height="60" rx="4" fill="#B5651D"
        stroke="#1A1F1B" stroke-width="3"/>
  <line x1="225" y1="190" x2="225" y2="250" stroke="#1A1F1B" stroke-width="1.5" opacity="0.6"/>
  <!-- Pannier strap (over back) -->
  <path d="M 215 195 Q 300 175 385 195" fill="none" stroke="#1A1F1B"
        stroke-width="3" stroke-linecap="round"/>

  <!-- Pannier (right side, loaded) -->
  <rect x="350" y="190" width="50" height="60" rx="4" fill="#B5651D"
        stroke="#1A1F1B" stroke-width="3"/>
  <line x1="375" y1="190" x2="375" y2="250" stroke="#1A1F1B" stroke-width="1.5" opacity="0.6"/>

  <!-- Head (long, mule-like) -->
  <g transform="translate(180, 240)">
    <!-- Neck -->
    <path d="M 0 0 Q -20 -20 -40 -30" fill="none" stroke="#5C4A3A"
          stroke-width="36" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="-50" cy="-30" rx="32" ry="22" fill="#5C4A3A"
             stroke="#1A1F1B" stroke-width="3"/>
    <!-- Snout (lighter) -->
    <ellipse cx="-72" cy="-26" rx="14" ry="10" fill="#F4E8D0"
             stroke="#1A1F1B" stroke-width="2"/>
    <!-- Nostril -->
    <ellipse cx="-80" cy="-28" rx="2" ry="3" fill="#1A1F1B"/>
    <!-- Mouth -->
    <path d="M -82 -22 Q -76 -20 -70 -22" fill="none" stroke="#1A1F1B"
          stroke-width="2" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="-50" cy="-38" r="3" fill="#1A1F1B"/>
    <circle cx="-50" cy="-38" r="1" fill="#F4E8D0"/>
    <!-- Ear (long, mule) -->
    <path d="M -40 -50 L -34 -68 L -28 -50 Z" fill="#5C4A3A"
          stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner ear -->
    <path d="M -38 -52 L -34 -64 L -32 -52 Z" fill="#B5651D" opacity="0.6"/>
    <!-- Mane (bristly, short) -->
    <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round">
      <line x1="-30" y1="-50" x2="-26" y2="-58"/>
      <line x1="-22" y1="-48" x2="-18" y2="-56"/>
      <line x1="-14" y1="-46" x2="-10" y2="-54"/>
      <line x1="-6" y1="-44" x2="-2" y2="-52"/>
    </g>
  </g>

  <!-- Tail (long, with tuft) -->
  <g>
    <path d="M 420 230 Q 460 240 480 270" fill="none" stroke="#5C4A3A"
          stroke-width="6" stroke-linecap="round"/>
    <path d="M 480 270 Q 490 280 488 295" fill="none" stroke="#5C4A3A"
          stroke-width="6" stroke-linecap="round"/>
    <circle cx="490" cy="298" r="6" fill="#1A1F1B"/>
  </g>

  <!-- Front legs -->
  <g stroke="#5C4A3A" stroke-width="14" stroke-linecap="round">
    <line x1="240" y1="280" x2="240" y2="320"/>
    <line x1="270" y1="290" x2="270" y2="320"/>
  </g>
  <!-- Hooves -->
  <g fill="#1A1F1B">
    <ellipse cx="240" cy="320" rx="10" ry="4"/>
    <ellipse cx="270" cy="320" rx="10" ry="4"/>
  </g>

  <!-- Back legs -->
  <g stroke="#5C4A3A" stroke-width="14" stroke-linecap="round">
    <line x1="330" y1="290" x2="330" y2="320"/>
    <line x1="360" y1="280" x2="360" y2="320"/>
  </g>
  <!-- Hooves -->
  <g fill="#1A1F1B">
    <ellipse cx="330" cy="320" rx="10" ry="4"/>
    <ellipse cx="360" cy="320" rx="10" ry="4"/>
  </g>

  <!-- A bundle of hay sticking out of left pannier -->
  <g stroke="#E8B65A" stroke-width="2" stroke-linecap="round">
    <line x1="210" y1="190" x2="208" y2="170"/>
    <line x1="220" y1="190" x2="222" y2="168"/>
    <line x1="230" y1="190" x2="232" y2="170"/>
    <line x1="240" y1="190" x2="238" y2="172"/>
  </g>

  <!-- Patient expression: closed eye (long lashes) -->
  <!-- (Already drew eye open; for "patient" feel, add a tiny smile near mouth) -->
  <!-- (Optional: hat tilted on head for charm) -->
</svg>