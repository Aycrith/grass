      Generated via the same SDXL+LoRA+IP-Adapter pipeline used
      for palm v3 and mower v3, but with a denoise=0.75 final
      setting (vs. 0.35 for the bulkier illustrations) and a NEW
      pre-rasterization step to fix a known SVG geometry bug.

      THE BUG: apps/web/public/logo-mark.svg has a center blade
      path that's mathematically zero-width
      (M 50 78 Q 50 25 50 8 - all x-coords = 50). When rasterized
      to 1024x1024, the center blade becomes a single pixel wide
      and the img2img model treats it as noise, erasing it. This
      was discovered on the FIRST seed 6001 candidate at denoise
      0.35 (the model produced only 2 outer blades + the base
      line, no center blade). Lowering denoise to 0.20 made no
      difference - the model had nothing to preserve.

      THE FIX: apps/comfyui/scripts/make-logo-input.ts generates
      a new 1024x1024 cream-background PNG that depicts the
      3-blade mark with ACTUAL visible widths (3 filled teardrop
      shapes with ~5px width + a 4px base line). The new input
      gives the model a clear shape to paint over, and at
      denoise=0.75 the model produced a beautiful painted mark:
      3 visible blades preserved, brushwork on the edges, subtle
      cream highlights in the silhouette (the "sunlit" highlights
      called for in the prompt), no LoRA bias, brand green dominant.

      4 candidates generated at seeds 6001-6004:
      - 6001 (CANONICAL): clean storybook icon style, 3 blades +
        tapered base line, no artifacts
      - 6002: more angular, ink-wash feel, base has tapered ends
      - 6003: clean blades but drippy paint drips on the base
      - 6004: very painterly but a weird gold "sword hilt" element
