<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Largo Lawn Yard Sign — Print-Ready</title>
<style>
  @page {
    size: 18in 24in;
    margin: 0;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: white;
    color: #1a2f25;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sign {
    width: 18in;
    height: 24in;
    background: #f7f1e3;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  /* mark zone */
  .mark-zone {
    flex: 0 0 4.5in;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f1e3;
    border-bottom: 0.04in solid #2f6b3d;
  }
  .mark {
    width: 4in;
    height: 4in;
    border-radius: 50%;
    background: #2f6b3d;
    color: #f7f1e3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 200pt;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  /* wordmark zone */
  .wm-zone {
    flex: 0 0 3in;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f1e3;
  }
  .wm {
    font-size: 240pt;
    font-weight: 900;
    color: #1a2f25;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  /* tagline */
  .tag-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f7f1e3;
    padding: 0.5in;
    box-sizing: border-box;
  }
  .tagline {
    text-align: center;
    font-size: 130pt;
    font-weight: 900;
    color: #2f6b3d;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  /* contact zone */
  .contact {
    flex: 0 0 4in;
    background: #1a2f25;
    color: #f7f1e3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.2in;
    padding: 0.5in;
    box-sizing: border-box;
  }
  .contact .row {
    font-size: 80pt;
    font-weight: 700;
    line-height: 1;
  }
  .contact .row .label {
    display: inline-block;
    width: 2.2in;
    color: #b3d4be;
    font-weight: 500;
  }
  /* bottom ribbon */
  .ribbon {
    flex: 0 0 1.8in;
    background: #2f6b3d;
    color: #f7f1e3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 100pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<section class="sign">
  <div class="mark-zone"><div class="mark">LL</div></div>
  <div class="wm-zone"><div class="wm">LARGO LAWN</div></div>
  <div class="tag-zone">
    <div class="tagline">YOUR NEIGHBOR'S<br/>LAWN MOWER</div>
  </div>
  <div class="contact">
    <div class="row"><span class="label">CALL</span> (727) 555-0123</div>
    <div class="row"><span class="label">WEB</span> largolawn.pro</div>
  </div>
  <div class="ribbon">FREE QUOTE · NO CONTRACT</div>
</section>
</body>
</html>
