<?xml version="1.0" encoding="UTF-8"?>
<!--
  phone-ringing.svg — ContactHero decoration.
  Hand-drawn rotary phone handset with motion arcs (ringing).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — ringing rotary handset">
  <title>Phone — ringing</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Phone base (round, low) -->
  <ellipse cx="300" cy="320" rx="120" ry="20" fill="#1A1F1B" opacity="0.15"/>
  <ellipse cx="300" cy="310" rx="120" ry="20" fill="#5C4A3A"
           stroke="#1A1F1B" stroke-width="3"/>

  <!-- Rotary dial on base -->
  <circle cx="300" cy="280" r="50" fill="#F4E8D0"
          stroke="#1A1F1B" stroke-width="3"/>
  <circle cx="300" cy="280" r="38" fill="#5C4A3A"
          stroke="#1A1F1B" stroke-width="2"/>
  <!-- Finger holes (10 round holes) -->
  <g fill="#1A1F1B">
    <circle cx="300" cy="248" r="3"/>
    <circle cx="322" cy="253" r="3"/>
    <circle cx="338" cy="270" r="3"/>
    <circle cx="343" cy="290" r="3"/>
    <circle cx="338" cy="310" r="3"/>
    <circle cx="322" cy="325" r="3"/>
    <circle cx="300" cy="332" r="3"/>
    <circle cx="278" cy="325" r="3"/>
    <circle cx="262" cy="310" r="3"/>
    <circle cx="257" cy="290" r="3"/>
    <circle cx="262" cy="270" r="3"/>
    <circle cx="278" cy="253" r="3"/>
  </g>
  <!-- Center spindle -->
  <circle cx="300" cy="280" r="6" fill="#E8B65A" stroke="#1A1F1B" stroke-width="1.5"/>

  <!-- Handset (cradle, angled, lifted) -->
  <g transform="translate(300, 200) rotate(-25)">
    <!-- Earpiece -->
    <ellipse cx="-90" cy="0" rx="30" ry="22" fill="#B5651D"
             stroke="#1A1F1B" stroke-width="3"/>
    <circle cx="-90" cy="0" r="12" fill="#1A1F1B" opacity="0.5"/>
    <!-- Mouthpiece -->
    <ellipse cx="90" cy="0" rx="30" ry="22" fill="#B5651D"
             stroke="#1A1F1B" stroke-width="3"/>
    <circle cx="90" cy="0" r="12" fill="#1A1F1B" opacity="0.5"/>
    <!-- Bar -->
    <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#B5651D"
          stroke="#1A1F1B" stroke-width="3"/>
  </g>

  <!-- Ringing motion arcs (3 expanding on each side) -->
  <g fill="none" stroke="#E8B65A" stroke-width="3" stroke-linecap="round">
    <!-- Right side -->
    <path d="M 440 200 Q 460 220 440 240"/>
    <path d="M 470 180 Q 500 220 470 260" opacity="0.7"/>
    <path d="M 500 160 Q 540 220 500 280" opacity="0.4"/>
    <!-- Left side -->
    <path d="M 160 200 Q 140 220 160 240"/>
    <path d="M 130 180 Q 100 220 130 260" opacity="0.7"/>
    <path d="M 100 160 Q 60 220 100 280" opacity="0.4"/>
  </g>

  <!-- Cord (curving from handset down to base) -->
  <path d="M 300 200 Q 260 240 240 280 Q 220 300 230 320"
        fill="none" stroke="#1A1F1B" stroke-width="3"
        stroke-linecap="round" opacity="0.6"/>
</svg>