<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hedge trimming illustration. Editorial layout: row of freshly
  trimmed geometric hedges, geometric top accent, sun in upper right.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
     aria-label="Hedge trimming — crisp geometric hedges">
  <title>Hedge trimming</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B65A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4E8D0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="640" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1280" cy="220" r="120" fill="#F6C673" opacity="0.85"/>
  <circle cx="1280" cy="220" r="60" fill="#E8B65A"/>

  <!-- Three rounded hedge forms, evenly spaced, freshly trimmed -->
  <g fill="#3A6B45">
    <ellipse cx="320" cy="640" rx="240" ry="180"/>
    <rect x="80" y="640" width="480" height="220"/>
  </g>
  <g fill="#2D5A3D">
    <ellipse cx="800" cy="600" rx="260" ry="200"/>
    <rect x="540" y="600" width="520" height="260"/>
  </g>
  <g fill="#3A6B45">
    <ellipse cx="1280" cy="640" rx="240" ry="180"/>
    <rect x="1040" y="640" width="480" height="220"/>
  </g>

  <!-- Highlight crescents on top of each hedge (golden hour rim light) -->
  <g fill="#5C8A4E" opacity="0.6">
    <ellipse cx="320" cy="468" rx="200" ry="40"/>
    <ellipse cx="800" cy="410" rx="220" ry="44"/>
    <ellipse cx="1280" cy="468" rx="200" ry="40"/>
  </g>

  <!-- Faint hedge-row shadow on the ground -->
  <rect y="860" width="1600" height="40" fill="#1F4E2C" opacity="0.45"/>

  <!-- Hedge trimmer silhouette (battery pack + shaft + blade) -->
  <g transform="translate(700 200)">
    <!-- battery / motor body -->
    <rect x="0" y="0" width="80" height="120" rx="14" fill="#1A1F1B"/>
    <rect x="14" y="20" width="50" height="60" rx="6" fill="#2D5A3D"/>
    <!-- shaft -->
    <line x1="40" y1="120" x2="40" y2="280"
          stroke="#1A1F1B" stroke-width="10" stroke-linecap="round"/>
    <!-- blade bar -->
    <rect x="-160" y="280" width="320" height="22" rx="6" fill="#1A1F1B"/>
    <!-- teeth -->
    <g fill="#E8B65A">
      <rect x="-150" y="276" width="6" height="14"/>
      <rect x="-120" y="276" width="6" height="14"/>
      <rect x="-90" y="276" width="6" height="14"/>
      <rect x="-60" y="276" width="6" height="14"/>
      <rect x="-30" y="276" width="6" height="14"/>
      <rect x="0" y="276" width="6" height="14"/>
      <rect x="30" y="276" width="6" height="14"/>
      <rect x="60" y="276" width="6" height="14"/>
      <rect x="90" y="276" width="6" height="14"/>
      <rect x="120" y="276" width="6" height="14"/>
      <rect x="148" y="276" width="6" height="14"/>
    </g>
    <!-- handle -->
    <path d="M 60 24 Q 110 4 140 24"
          stroke="#1A1F1B" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Trimmings falling -->
  <g fill="#5C8A4E" opacity="0.8">
    <ellipse cx="500" cy="600" rx="6" ry="2" transform="rotate(30 500 600)"/>
    <ellipse cx="540" cy="640" rx="5" ry="2" transform="rotate(-20 540 640)"/>
    <ellipse cx="900" cy="560" rx="6" ry="2" transform="rotate(45 900 560)"/>
    <ellipse cx="940" cy="620" rx="5" ry="2" transform="rotate(15 940 620)"/>
    <ellipse cx="1100" cy="580" rx="6" ry="2" transform="rotate(-30 1100 580)"/>
  </g>

  <!-- Eyebrow / label -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="100" font-size="16" font-weight="700"
          fill="#B5651D" letter-spacing="3">04 — HEDGE TRIMMING</text>
    <text x="80" y="170" font-family="'Fraunces', Georgia, serif"
          font-size="64" font-weight="700"
          fill="#1A1F1B" letter-spacing="-2">Crisp edges</text>
    <text x="80" y="232" font-family="'Fraunces', Georgia, serif"
          font-size="64" font-weight="700"
          fill="#1A1F1B" letter-spacing="-2">all summer long.</text>
    <text x="80" y="290" font-size="18" font-weight="500"
          fill="#1A1F1B" opacity="0.72">
      Shrubs up to 12 ft. Geometric or natural — your call.
    </text>
  </g>
</svg>