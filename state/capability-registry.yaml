    name: "Hurricane mode — pause + auto-credit + customer comms"
    owner_agent: operations
    status: reserved
    mission: "M1"
    note: |
      Day 4 risk register R-HURR-001 calls this out as a Day-1 capability
      for any field crew. Will be formally authored Day 4.

  - cap_id: cap_auto_quote_mowing
    name: "Auto-quote mowing for known property × frequency"
    owner_agent: sales
    status: reserved
    mission: "M1"
    note: "Depends on price-book + lot-size polygon data. Month 3+ target."

  - cap_id: cap_review_request
    name: "Auto-request Google review post-job"
    owner_agent: marketing
    status: reserved
    mission: "M1"
    note: "Critical for SEO. Twilio SMS + email fallback. Month 3+ target."

  - cap_id: cap_recurring_schedule
    name: "Recurring schedule generation (weekly mowing cadence)"
    owner_agent: operations
    status: reserved
    mission: "M1"
    note: "Predicts next 4-12 weeks of jobs for a customer. Month 3+ target."

# -------------------------------------------------------------------
# Reusability tracker (the charter-proof metric)
# -------------------------------------------------------------------
# Updated monthly. Tracks what percentage of registered capabilities
# are reusable across missions vs mission-specific.
reusability:
  total_capabilities: 6
  reserved_capabilities: 10  # 6 active caps + 4 reserved (all moved to reserved per D-0068)
  mission_specific: 6  # all 6 landscaping seeds are M1-specific today
  reusable_across_missions: 0
  reusability_pct: 0.0
  target_by_month_6: 0.60
  notes: |
    As Mission 1 capabilities mature, look for patterns reusable to
    Mission 2 (whatever it ends up being). Refactor into
    `platform/packages/` and mark them reusable. This number is the
    single most important chart for proving the charter is working.

