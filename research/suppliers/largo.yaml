## Recommended equipment starter kit (Mission 1 Day-1)

| Equipment | New price (approx.) | Used price (approx.) | Notes |
|---|---|---|---|
| Exmark Lazer Z 60" (zero-turn, primary mower) | $9,500-12,000 | $5,500-8,000 (1-2 yr old) | The workhorse; 60" deck for 0.4-0.5 acre lots |
| Honda HRX217 (walk-behind backup, gates) | $700 | $300-450 | For fenced back yards |
| Stihl FS 91 R (string trimmer) | $380 | $180-250 | Primary trimmer |
| Echo SRM-225 (backup trimmer) | $300 | $120-180 | Secondary trimmer |
| Stihl HS 56 (hedge trimmer) | $350 | $150-220 | Hedge work |
| Stihl BR 600 (backpack blower) | $550 | $250-350 | Blower |
| Stihl FC 91 (edger) | $350 | $150-200 | Edging |
| **TOTAL equipment (new)** | **~$12,130-14,130** | | |
| **TOTAL equipment (used)** | | **~$6,650-9,650** | |

**Decision for steward:** new vs used? Trade-off:
- **New:** warranty, predictable reliability, no first-100-hour issues. Total ~$13K.
- **Used:** ~50% savings, faster availability, but 1-2 yr old units need maintenance sooner. Total ~$8K.

**Recommendation for Day 1:** Buy the primary mower USED (savings ~$4-5K); buy handheld equipment NEW (warranty, small dollar amounts). Total Day-1 equipment ~$8K.

