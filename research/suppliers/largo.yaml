---

## Operational notes

1. **Supplier relationships matter.** A 5% volume discount at SiteOne can save $500-1000/year.
2. **Trade accounts require FEIN/EIN** (D-0005). Open accounts in Week 1 of operations.
3. **Cash flow vs equipment CAPEX:** Total equipment purchase ~$8-13K. Don't finance; use cash reserve (1-month operating + equipment float).
4. **Storage:** Equipment must be stored under cover (theft + weather). Rental of a 10x10 storage unit ~$100/mo in Largo. Alternative: home garage if available.

---

## What this plan does NOT lock

- **Specific brand preferences** (Exmark vs Scag vs Toro) — buy whatever's available used in good condition.
- **Trailer size** — depends on truck. 12-16 ft open landscape is standard.
- **Truck choice** — used 1/2 ton (F-150, Silverado 1500, Tundra) is appropriate. New trucks are wasteful at this stage.

