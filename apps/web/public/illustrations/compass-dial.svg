<?xml version="1.0" encoding="UTF-8"?>
<!--
  compass-dial.svg — FinalCTABanner decoration.
  Hand-drawn compass with N pointing at the viewer (decisive direction).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — compass dial with north star highlighted">
  <title>Compass — direction forward</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Outer brass ring -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#B5651D"
          stroke-width="6"/>
  <circle cx="300" cy="200" r="160" fill="#5C4A3A" opacity="0.15"/>

  <!-- Cardinal tick marks (numbered) -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#1A1F1B"
     font-weight="600" text-anchor="middle">
    <text x="300" y="38">0°</text>
    <text x="300" y="378">180°</text>
    <text x="138" y="206">270°</text>
    <text x="462" y="206">90°</text>
  </g>
  <!-- Tick marks -->
  <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="48" x2="300" y2="62"/>
    <line x1="300" y1="338" x2="300" y2="352"/>
    <line x1="148" y1="200" x2="162" y2="200"/>
    <line x1="438" y1="200" x2="452" y2="200"/>
  </g>

  <!-- Compass rose (8-pointed star) -->
  <g>
    <!-- Major points -->
    <path d="M 300 70 L 312 200 L 300 196 L 288 200 Z"
          fill="#B5651D" stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 430 200 L 300 188 L 304 200 L 300 212 Z"
          fill="#F4E8D0" stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 300 330 L 288 200 L 300 204 L 312 200 Z"
          fill="#F4E8D0" stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 170 200 L 300 212 L 296 200 L 300 188 Z"
          fill="#F4E8D0" stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Minor points (NE, SE, SW, NW) -->
    <g fill="#8FA89B" stroke="#1A1F1B" stroke-width="1.5" opacity="0.85">
      <path d="M 380 120 L 308 196 L 300 188 Z"/>
      <path d="M 380 280 L 308 204 L 300 212 Z"/>
      <path d="M 220 280 L 292 204 L 300 212 Z"/>
      <path d="M 220 120 L 292 196 L 300 188 Z"/>
    </g>
  </g>

  <!-- Center hub -->
  <circle cx="300" cy="200" r="10" fill="#1A1F1B"/>
  <circle cx="300" cy="200" r="5" fill="#E8B65A"/>

  <!-- Inner ring -->
  <circle cx="300" cy="200" r="80" fill="none" stroke="#1A1F1B"
          stroke-width="1.5" opacity="0.5"/>

  <!-- Sun glint on north -->
  <g stroke="#E8B65A" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="76" x2="300" y2="86"/>
    <line x1="290" y1="80" x2="295" y2="86"/>
    <line x1="310" y1="80" x2="305" y2="86"/>
  </g>
</svg>