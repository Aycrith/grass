# GRASS — Pinellas County Supplier & Equipment Ecosystem

**Date:** 2026-07-10 | **Owner:** operations agent (with research support) | **Decision dependency:** None directly; informs COGS in price-book.yaml

---

## TL;DR

Pinellas County has **3 major landscape suppliers within 20 miles** (SiteOne, Horizon, Ewing) and **multiple equipment dealers** (Stihl, Honda, Exmark, Scag, Toro). Lead time on commercial mowers during hurricane season (June-November) can hit 6-8 weeks. Equipment acquisition must precede the Month 2 closed-beta launch by at least 4 weeks.

