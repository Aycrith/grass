<?xml version="1.0" encoding="UTF-8"?>
<!--
  Largo Lawn — monochrome mark (currentColor).
  Uses fill="currentColor" so the parent CSS color cascades into the
  mark. Use for: laser engraving, single-ink print (business cards,
  yard signs in black-only mode), and any context that needs one ink.
  Default color is --ll-palm-bark (the closest single-ink equivalent
  of the brand green) — override via CSS color on the parent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Largo Lawn mark (monochrome)">
  <title>Largo Lawn mark — monochrome</title>
  <desc>Single-ink grass mark. fill uses currentColor.</desc>
  <g fill="currentColor" color="#1A1F1B">
    <path d="M 50 78 Q 50 25 50 8 Q 50 25 50 78 Z" />
    <path d="M 32 78 Q 28 35 22 18 Q 30 38 38 78 Z" />
    <path d="M 68 78 Q 72 35 78 18 Q 70 38 62 78 Z" />
    <rect x="14" y="76" width="72" height="4" rx="2" />
  </g>
</svg>