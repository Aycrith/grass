<?xml version="1.0" encoding="UTF-8"?>
<!--
  D-0018b paper-grain texture — SVG noise pattern for the page-wide
  texture overlay.

  Uses SVG `feTurbulence` (FractalNoise) to generate a 200x200
  tileable grain pattern. The grain is rendered with low-opacity
  dark color, then applied to the body via CSS ::before with
  `mix-blend-mode: multiply` at 5% opacity. The result is a
  subtle "paper" texture across the cream sections of the page
  that ties the painted storybook imagery to a printed-on-paper
  feel without being noticeable enough to be a distraction.

  Why feTurbulence: vector noise is infinite-resolution and
  tileable, so the browser scales it to any device pixel ratio
  without artifact. A raster grain would compress poorly and
  show banding on retina displays.

  Single 1.4 KB file, no JS, no animation. Set in globals.css
  via `body::before` with the SVG as `background-image: url(...)`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <filter id="grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.85"
      numOctaves="2"
      seed="3"
      stitchTiles="stitch"
    />
    <feColorMatrix
      type="matrix"
      values="0 0 0 0 0.18
              0 0 0 0 0.15
              0 0 0 0 0.12
              0 0 0 0.5 0"
    />
  </filter>
  <rect width="200" height="200" filter="url(#grain)" />
</svg>
