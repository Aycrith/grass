# -------------------------------------------------------------------
# Reusability tracker (the charter-proof metric)
# -------------------------------------------------------------------
# Updated monthly. Tracks what percentage of registered capabilities
# are reusable across missions vs mission-specific.
reusability:
  total_capabilities: 6
  reserved_capabilities: 10  # 6 active caps + 4 reserved (all moved to reserved per D-0068)
  mission_specific: 6  # all 6 landscaping seeds are M1-specific today
  reusable_across_missions: 0
  reusability_pct: 0.0
  target_by_month_6: 0.60
  notes: |
    As Mission 1 capabilities mature, look for patterns reusable to
    Mission 2 (whatever it ends up being). Refactor into
    `platform/packages/` and mark them reusable. This number is the
    single most important chart for proving the charter is working.

