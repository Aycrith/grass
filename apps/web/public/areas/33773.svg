<?xml version="1.0" encoding="UTF-8"?>
<!--
  33773 — Northeast Largo. Condos + townhomes, more density.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="33773 — Northeast Largo">
  <title>33773 — Northeast Largo</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E8D0"/>
      <stop offset="1" stop-color="#E8B65A" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- Multi-story condo block (left) -->
  <g transform="translate(80 60)">
    <rect x="0" y="0" width="320" height="380" fill="#D4A574"/>
    <rect x="0" y="0" width="320" height="20" fill="#5C4A3A"/>
    <rect x="0" y="200" width="320" height="6" fill="#B5651D"/>
    <g fill="#1A1F1B" opacity="0.55">
      <rect x="20" y="40" width="50" height="50"/>
      <rect x="90" y="40" width="50" height="50"/>
      <rect x="160" y="40" width="50" height="50"/>
      <rect x="230" y="40" width="50" height="50"/>
      <rect x="20" y="120" width="50" height="50"/>
      <rect x="90" y="120" width="50" height="50"/>
      <rect x="160" y="120" width="50" height="50"/>
      <rect x="230" y="120" width="50" height="50"/>
      <rect x="20" y="230" width="50" height="50"/>
      <rect x="90" y="230" width="50" height="50"/>
      <rect x="160" y="230" width="50" height="50"/>
      <rect x="230" y="230" width="50" height="50"/>
      <rect x="20" y="310" width="50" height="50"/>
      <rect x="90" y="310" width="50" height="50"/>
      <rect x="160" y="310" width="50" height="50"/>
      <rect x="230" y="310" width="50" height="50"/>
    </g>
    <g fill="#5C4A3A" opacity="0.6">
      <rect x="14" y="92" width="62" height="6"/>
      <rect x="84" y="92" width="62" height="6"/>
      <rect x="154" y="92" width="62" height="6"/>
      <rect x="224" y="92" width="62" height="6"/>
    </g>
  </g>

  <!-- Townhome row (right) -->
  <g transform="translate(440 200)">
    <g>
      <rect x="0" y="0" width="120" height="240" fill="#F4E8D0"/>
      <polygon points="0,0 60,-30 120,0" fill="#5C4A3A"/>
      <rect x="20" y="40" width="30" height="30" fill="#1A1F1B" opacity="0.55"/>
      <rect x="70" y="40" width="30" height="30" fill="#1A1F1B" opacity="0.55"/>
      <rect x="40" y="120" width="40" height="80" fill="#5C4A3A"/>
    </g>
    <g transform="translate(140 0)">
      <rect x="0" y="0" width="120" height="240" fill="#D4A574"/>
      <polygon points="0,0 60,-30 120,0" fill="#5C4A3A"/>
      <rect x="20" y="40" width="30" height="30" fill="#1A1F1B" opacity="0.55"/>
      <rect x="70" y="40" width="30" height="30" fill="#1A1F1B" opacity="0.55"/>
      <rect x="40" y="120" width="40" height="80" fill="#5C4A3A"/>
