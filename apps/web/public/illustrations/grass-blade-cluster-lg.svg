<?xml version="1.0" encoding="UTF-8"?>
<!--
  grass-blade-cluster.svg — Decorative anchor used across sections.
  Hand-drawn cluster of 7 St. Augustine grass blades.
  200×200 viewBox (medium size — can be scaled to 100×100, 150×150, or 200×200).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Illustration — cluster of grass blades">
  <title>Grass blades</title>

  <!-- Ground hint -->
  <path d="M 20 180 Q 100 175 180 180" fill="none" stroke="#5C4A3A"
        stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Blade cluster -->
  <g stroke="#1F4E2C" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 60 180 Q 58 140 56 100 Q 54 70 60 40"/>
    <path d="M 80 180 Q 82 140 80 100 Q 78 60 90 30"/>
    <path d="M 100 180 Q 102 130 100 90 Q 98 50 110 20"/>
    <path d="M 120 180 Q 122 140 120 100 Q 118 60 130 30"/>
    <path d="M 140 180 Q 138 140 136 100 Q 134 70 140 40"/>
    <path d="M 50 180 Q 48 150 50 120 Q 52 90 50 60"/>
    <path d="M 150 180 Q 152 150 150 120 Q 148 90 150 60"/>
  </g>

  <!-- Highlight strokes (sun catching blades) -->
  <g stroke="#8FA89B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 58 170 Q 56 130 56 90"/>
    <path d="M 78 170 Q 80 130 80 90"/>
    <path d="M 98 170 Q 100 130 100 90"/>
    <path d="M 118 170 Q 120 130 120 90"/>
    <path d="M 138 170 Q 136 130 136 90"/>
  </g>
</svg>