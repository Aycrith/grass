    decision: D-0049-rev-2
    decision_subrecord: "Drop palms foreground parallax"
    title: "D-0049 rev 2 — drop palms-01..06 foreground parallax from SecondScene"
    summary: >
      The D-0049 first pass overlaid palms-01..06.webp at bottom-right
      with mix-blend-mode: multiply (the D-0047 Wave 4 pattern). The
      D-0048 re-extracted palms frames are FULL painted Florida scenes
      (1240×680 — house, big sun, palm trees, bird bath), not the slim
      letterbox strips the Wave 4 pattern assumed. Reusing the same
      "background-size: 42% auto, right bottom" pattern put a giant
      palm tree + sun on top of the painted scene 2 instead of a slim
