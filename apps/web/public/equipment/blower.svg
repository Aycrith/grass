<?xml version="1.0" encoding="UTF-8"?>
<!--
  Leaf blower equipment illustration. Battery-powered handheld.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Battery leaf blower">
  <title>Blower</title>

  <rect width="400" height="300" fill="#F4E8D0"/>

  <rect y="220" width="400" height="80" fill="#A8A8A0"/>
  <rect y="220" width="400" height="6" fill="#FAF6F0"/>

  <!-- Leaves being blown -->
  <g fill="#B5651D">
    <ellipse cx="320" cy="220" rx="10" ry="4" transform="rotate(20 320 220)"/>
    <ellipse cx="340" cy="210" rx="12" ry="5" transform="rotate(-15 340 210)"/>
    <ellipse cx="360" cy="200" rx="9" ry="4" transform="rotate(30 360 200)"/>
    <ellipse cx="380" cy="180" rx="11" ry="4" transform="rotate(-25 380 180)"/>
  </g>
  <g fill="#D4A574">
    <ellipse cx="330" cy="195" rx="9" ry="4" transform="rotate(40 330 195)"/>
    <ellipse cx="350" cy="185" rx="11" ry="4" transform="rotate(-30 350 185)"/>
    <ellipse cx="370" cy="170" rx="9" ry="4" transform="rotate(15 370 170)"/>
  </g>

  <g stroke="#8FA89B" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 240 200 Q 280 195 320 200"/>
    <path d="M 240 210 Q 280 205 320 210"/>
    <path d="M 240 190 Q 280 185 320 190"/>
  </g>

  <g transform="translate(60 130)">
    <rect x="0" y="0" width="100" height="60" rx="14" fill="#1A1F1B"/>
    <rect x="10" y="10" width="50" height="40" rx="6" fill="#2D5A3D"/>
    <rect x="30" y="50" width="40" height="40" rx="8" fill="#B5651D"/>
    <path d="M 100 15 L 180 5 L 180 55 L 100 45 Z" fill="#1A1F1B"/>
    <rect x="170" y="0" width="14" height="60" rx="4" fill="#2D5A3D"/>
    <rect x="50" y="60" width="20" height="14" rx="3" fill="#B5651D"/>
  </g>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.7">
    <text x="20" y="36" font-size="14" font-weight="700" letter-spacing="2">BLOWER</text>
  </g>
</svg>