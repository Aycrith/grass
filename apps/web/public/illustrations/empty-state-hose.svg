<?xml version="1.0" encoding="UTF-8"?>
<!--
  EmptyState — FAQ / "no answer yet" illustration.
  Hose curl forming a question mark. Used when an FAQ list is empty
  before steward adds entries.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img"
     aria-label="Hose curl forming a question mark">
  <title>Empty state — no answers yet</title>

  <!-- Sand background -->
  <rect width="400" height="400" fill="#F4E8D0" rx="16"/>

  <!-- Hose question mark, hand-drawn curve -->
  <path d="M 160 200
           Q 160 120 220 110
           Q 280 100 280 160
           Q 280 200 240 220
           Q 220 232 220 260"
        stroke="#2D5A3D" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="220" cy="320" r="14" fill="#2D5A3D"/>

  <!-- Hose highlight -->
  <path d="M 170 200
           Q 170 130 220 122
           Q 270 114 270 160
           Q 270 196 240 212"
        stroke="#5C8A4E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Hose coupling rings -->
  <g fill="#5C4A3A">
    <rect x="150" y="190" width="14" height="24" rx="2"/>
    <rect x="278" y="156" width="14" height="24" rx="2" transform="rotate(20 285 168)"/>
  </g>

  <!-- Sun in upper right -->
  <circle cx="340" cy="60" r="28" fill="#E8B65A" opacity="0.85"/>
  <circle cx="340" cy="60" r="14" fill="#F6C673"/>

  <!-- Sprinkler droplets around hose end -->
  <g fill="var(--ll-gulf, #2e6b8c)" opacity="0.75">
    <ellipse cx="180" cy="350" rx="3" ry="5"/>
    <ellipse cx="160" cy="340" rx="3" ry="5"/>
    <ellipse cx="200" cy="340" rx="3" ry="5"/>
    <ellipse cx="220" cy="360" rx="3" ry="5"/>
    <ellipse cx="260" cy="350" rx="3" ry="5"/>
  </g>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.55">
    <text x="200" y="384" font-size="12" font-weight="600"
          text-anchor="middle" letter-spacing="3">NO ANSWERS YET</text>
  </g>
</svg>