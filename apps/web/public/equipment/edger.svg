<?xml version="1.0" encoding="UTF-8"?>
<!--
  Edger equipment illustration. Walk-behind stick edger with blade guard.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Stick edger">
  <title>Edger</title>

  <rect width="400" height="300" fill="#F4E8D0"/>

  <!-- Ground + curb -->
  <rect y="220" width="400" height="80" fill="#2D5A3D"/>
  <rect y="220" width="400" height="6" fill="#FAF6F0"/>
  <rect y="226" width="400" height="20" fill="#A8A8A0"/>

  <!-- Edger -->
  <g transform="translate(150 30)">
    <rect x="40" y="20" width="80" height="50" rx="8" fill="#1A1F1B"/>
    <rect x="50" y="30" width="60" height="30" rx="4" fill="#2D5A3D"/>
    <line x1="60" y1="20" x2="40" y2="-20"
          stroke="#1A1F1B" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="20" x2="120" y2="-20"
          stroke="#1A1F1B" stroke-width="8" stroke-linecap="round"/>
    <rect x="20" y="-30" width="40" height="10" rx="5" fill="#B5651D"/>
    <rect x="100" y="-30" width="40" height="10" rx="5" fill="#B5651D"/>
    <line x1="80" y1="70" x2="80" y2="180"
          stroke="#1A1F1B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 60 180 Q 80 200 100 180 L 100 210 L 60 210 Z" fill="#1A1F1B"/>
    <circle cx="80" cy="206" r="20" fill="#B5651D"/>
    <circle cx="80" cy="206" r="6" fill="#1A1F1B"/>
    <g fill="#B5651D">
      <rect x="76" y="184" width="8" height="4"/>
      <rect x="76" y="222" width="8" height="4"/>
      <rect x="58" y="202" width="4" height="8"/>
      <rect x="98" y="202" width="4" height="8"/>
    </g>
    <circle cx="50" cy="220" r="14" fill="#1A1F1B"/>
    <circle cx="50" cy="220" r="6" fill="#3A2614"/>
    <circle cx="110" cy="220" r="14" fill="#1A1F1B"/>
    <circle cx="110" cy="220" r="6" fill="#3A2614"/>
  </g>

  <!-- Sparks at the cutting head -->
  <g stroke="#E8B65A" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 240 240 L 260 248"/>
    <path d="M 220 240 L 200 250"/>
    <path d="M 230 250 L 240 270"/>
  </g>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.7">
    <text x="20" y="36" font-size="14" font-weight="700" letter-spacing="2">EDGER</text>
  </g>
</svg>