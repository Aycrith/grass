<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" role="img" aria-label="Pressed specimen of Bahiagrass, Paspalum notatum">
  <title>Bahiagrass — Paspalum notatum</title>

  <!-- Aged paper background -->
  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

  <!-- Press rings -->
  <g opacity="0.08" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.3">
    <circle cx="170" cy="160" r="125" />
    <circle cx="170" cy="160" r="105" />
    <circle cx="170" cy="160" r="85" />
    <circle cx="170" cy="160" r="65" />
  </g>

  <!-- Border -->
  <rect x="14" y="14" width="312" height="312" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" opacity="0.4" />

  <!-- BAHIA SEEDHEAD: distinctive Y-SHAPE (two spikes on a single stalk — most diagnostic) -->
  <g transform="translate(170 60)">
    <!-- Main stalk from base to fork -->
    <line x1="0" y1="20" x2="0" y2="0" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.7" stroke-linecap="round" />
    <!-- Left arm of the Y (longer, angled up-left) -->
    <g transform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="-44" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.6" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55">
        <line x1="-0.6" y1="-6" x2="0.6" y2="-6" />
        <line x1="-0.6" y1="-12" x2="0.6" y2="-12" />
        <line x1="-0.6" y1="-18" x2="0.6" y2="-18" />
        <line x1="-0.6" y1="-24" x2="0.6" y2="-24" />
        <line x1="-0.6" y1="-30" x2="0.6" y2="-30" />
        <line x1="-0.5" y1="-36" x2="0.5" y2="-36" />
      </g>
    </g>
    <!-- Right arm of the Y (angled up-right) -->
    <g transform="rotate(25)">
      <line x1="0" y1="0" x2="0" y2="-38" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.6" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55">
        <line x1="-0.6" y1="-6" x2="0.6" y2="-6" />
        <line x1="-0.6" y1="-12" x2="0.6" y2="-12" />
        <line x1="-0.6" y1="-18" x2="0.6" y2="-18" />
        <line x1="-0.6" y1="-24" x2="0.6" y2="-24" />
        <line x1="-0.6" y1="-30" x2="0.6" y2="-30" />
        <line x1="-0.5" y1="-36" x2="0.5" y2="-36" />
      </g>
    </g>
    <!-- Center small spike (the third arm, often present) -->
    <g>
      <line x1="0" y1="0" x2="0" y2="-22" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.55">
        <line x1="-0.4" y1="-6" x2="0.4" y2="-6" />
        <line x1="-0.4" y1="-12" x2="0.4" y2="-12" />
        <line x1="-0.4" y1="-18" x2="0.4" y2="-18" />
      </g>
    </g>
  </g>

  <!-- 3 COARSE, UPRIGHT blades with V-shape center fold (diagnostic) -->
  <!-- Bahia has OPEN, UPRIGHT growth — fewer blades, more vertical -->
  <!-- Blade 1: left, with center fold (V-shape) -->
  <g>
    <path d="M 170 222 Q 156 150 150 80 L 150 72 L 156 70 L 162 72 L 160 80 Q 162 150 170 222 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="156" y1="80" x2="166" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />
    <line x1="154" y1="90" x2="164" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
    <line x1="158" y1="90" x2="168" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
  </g>

  <!-- Blade 2: center, tallest (with Y-seedhead) - V-fold -->
  <g>
    <path d="M 170 222 Q 170 140 170 80 L 170 60 L 176 58 L 182 60 L 180 80 Q 180 140 170 222 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="176" y1="70" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />
    <line x1="174" y1="80" x2="172" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
    <line x1="178" y1="80" x2="176" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
  </g>

  <!-- Blade 3: right, V-fold -->
  <g>
    <path d="M 170 222 Q 184 150 190 80 L 190 72 L 184 70 L 178 72 L 180 80 Q 180 150 170 222 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <line x1="184" y1="80" x2="176" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.25" opacity="0.6" />
    <line x1="186" y1="90" x2="178" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
    <line x1="182" y1="90" x2="174" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.18" opacity="0.4" />
  </g>

  <!-- RHIZOMES ONLY (no stolons) — Bahia's distinguishing feature -->
  <ellipse cx="170" cy="222" rx="22" ry="5" fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.15" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />

  <!-- Soil line -->
  <line x1="40" y1="228" x2="300" y2="228" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.6" />

  <!-- THICK RHIZOMES (the "highway grass" underground spreader) -->
  <path d="M 170 232 Q 130 240 90 248 Q 70 252 50 258"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M 170 232 Q 210 240 250 248 Q 270 252 290 258"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="2.4" stroke-linecap="round" />
  <!-- Rhizome segment marks (visible segments like real rhizomes) -->
  <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.3" opacity="0.5">
    <line x1="130" y1="240" x2="130" y2="244" />
    <line x1="100" y1="246" x2="100" y2="250" />
    <line x1="210" y1="240" x2="210" y2="244" />
    <line x1="240" y1="246" x2="240" y2="250" />
  </g>
  <!-- Rhizome nodes -->
  <circle cx="130" cy="240" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="100" cy="246" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="210" cy="240" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="240" cy="246" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="170" cy="232" r="2" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- A new shoot emerging from one rhizome node (Bahia's "highway grass" colonization) -->
  <g transform="translate(100 246)">
    <line x1="0" y1="0" x2="-2" y2="-12" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" stroke-linecap="round" />
    <path d="M -2 -12 Q -5 -8 -6 -4 L -3 -2 L 0 -11 Z" fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.2" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.3" />
  </g>

  <!-- Corner stamp -->
  <g transform="translate(28 32) rotate(-3)" opacity="0.7">
    <rect x="0" y="0" width="50" height="22" fill="none" stroke="var(--ll-clay, #b5651d)" stroke-width="0.7" rx="2" />
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="var(--ll-clay, #b5651d)">FL-04</text>
  </g>

  <!-- Specimen tag -->
  <g transform="translate(170 272)">
    <rect x="0" y="0" width="160" height="50" fill="var(--ll-label-tan, #f0e6d0)" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.5" />
    <text x="6" y="13" font-family="Georgia, serif" font-size="9" font-style="italic" fill="var(--ll-sepia, #5a3e1f)">Paspalum notatum</text>
    <text x="6" y="24" font-family="sans-serif" font-size="7.5" fill="var(--ll-sepia, #5a3e1f)">Bahiagrass · "highway grass"</text>
    <text x="6" y="34" font-family="sans-serif" font-size="6.5" fill="var(--ll-sepia, #5a3e1f)" opacity="0.85">3.0–4.0 in · 7–17 d · rhizomes only</text>
    <text x="6" y="44" font-family="sans-serif" font-size="6" fill="var(--ll-sepia, #5a3e1f)" opacity="0.7">Largo FL · 2026-07-21</text>
  </g>
</svg>
