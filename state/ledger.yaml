    title: "D-0048 redesign — texture-per-plane + real-browser review surface + cream-colored canvas"
    summary: >
      D-0048 first-pass produced a still-beautiful component but with
      a fragmented/3-timestamp-mashup visual quality: all 3 planes cycled
      through the SAME scene2 strip, producing 3 frames-at-3-different-
      times overlaid rather than a coherent 2.5D scene. Redesign
      addresses this at 4 layers.

      (1) Texture-per-plane architecture. Each plane now owns its own
      VEO-derived strip — re-extracted from the existing grasscontent
      mp4 sources:
        - BG plane  → scene2-01..06.webp  (Florida ranch house, palms,
                                          sun, mower, asymmetric)
        - MID plane → palms-01..06.webp   (palms framing ranch house,
                                          right-offset)
        - FG plane  → fern-01..06.webp    (close-up fern frond on
                                          paper-cream bg, left-edge)
      Three new texture arrays live in HeroScene3D.tsx (SCENE2_TEXTURES,
      PALMS_TEXTURES, FERN_TEXTURES, each 6 frames at 1240×680). At any
      moment the 3 planes show 3 different VEO compositions at 3 different
      depths — true parallax depth, not a 3-frame mashup.

      (2) Per-plane cycling cadence + sway tuned for visual rhythm.
      Each plane now has its own ambient signature:
        - BG  scene2:  cycleSec=12, swayDeg=0.5, cyclePhase=0  (slow,
                                                             calm)
        - MID palms:   cycleSec=9,  swayDeg=1.5, cyclePhase=3, swayPhase=π/3
        - FG  fern:    cycleSec=6,  swayDeg=3,   cyclePhase=5, swayPhase=π/1.5
      Asynchronous cyclePhase + swayPhase means texture swaps and wind
      motion never align across planes — the scene reads as 3 layers
      living separate microclimates.

      (3) Cream canvas + dedicated scrim. Scene2D5 now sets
      scene.background = new THREE.Color('#faf6f0') in useEffect so
      any sub-pixel gaps or camera-orbit edge bleed renders as cream
      (matching --ll-cream) instead of R3F's default black clear color.
      A new .scrim div in HeroScene3D.module.css sits between the
      canvas and the editorial content overlay with a cream-to-clear
      gradient ramp (0.98 → 0.94 → 0.78 → 0.35 → 0.05 → 0) — anchors
      the bottom editorial pull-quote against any illustrated element
      behind it (the photo's dark stage never bleeds through during
      the 45%/70% cross-fades). Plus: camera orbit strengthened from
      6° → 8° so parallax between BG/MID/FG is actually perceptible;
      cream fog (FOG_NEAR=10, FOG_FAR=22) tuned to match the camera
      frustum so distant planes fade into the cream backdrop.

      (4) /hero-3d-test route. New page at apps/web/src/app/hero-3d-test/
      ({page,layout}.tsx + page.module.css) mounts <HeroScene3D /> in
      isolation with mock MotionValues (opacity / contentOpacity /
      scrollProgress all start at 1, fully revealed). A right-rail
      debug panel exposes 3 sliders (camera orbit via scrollProgress,
      scene opacity, content opacity) + WebGL-availability probe + a
      3-plane legend with color-coded dots (BG deep-green / MID green /
      FG sun). The route is the only place the WebGL scene can be
      visually confirmed — headless Chrome drops the WebGL context
      during page load (D-0048 §Risk R-LOADTIME confirmed). Steward
      workflow: open /hero-3d-test in a real browser, scrub the
      scrollProgress slider, observe parallax between 3 planes +
      wind sway + texture cycling, then sign off on a target value
      (the production hero drives scrollProgress via useScroll).

      Steward directive that drove this redesign: "ship each wave
      when it is ready and has been through as many visual design and
      improvement/augmentation passes to ensure that this is as high
      quality and artistically presentable as possible" and "do what
      results in the best possible, highest quality animated 3d scene
      as a result." First-pass D-0048 honored the spirit but produced
      a fragmented visual; this redesign runs the same Three.js stack
      with a different texture-per-plane architecture that is what the
      directive actually wants.

      Files changed: 5 modified, 3 new.
        Modified: HeroScene3D.tsx (3-plane texture routing +
                 per-plane cadence/sway tuning + scene.background cream
                 + useEffect on scene fog/bg), HeroScene3D.module.css
                 (.scrim div CSS, removed .root bg gradient), apps/web/
                 src/components/sections/HeroScene3D.tsx (per-plane
                 props on CycledPlane: cyclePhase, swayPhase),
                 governance/decisions/0048-hero-3d-scene-replacement.md
                 (R48.2/R48.3/R48.6/R48.7/R48.8 rewritten, R48.8b added).
        New: apps/web/src/app/hero-3d-test/layout.tsx (noindex),
             apps/web/src/app/hero-3d-test/page.tsx (~120 lines,
             debug panel + 3 sliders + WebGL probe),
             apps/web/src/app/hero-3d-test/page.module.css,
             apps/web/public/hero/layers/v2/palms-01..06.webp (re-
             extracted at 1240×680, ~38KB each, ~228KB total),
             apps/web/public/hero/layers/v2/fern-01..06.webp (re-
             extracted at 1240×680, ~38KB each, ~228KB total),
             Downloads/grasscontent/prep-palms-fern-frames.py (NEW
             extraction driver: ffmpeg select→PIL crop→chroma key→
             webp encode for palms + fern sources).

      Validation: bunx tsc --noEmit clean (no new TS errors from
      per-plane prop interface change); HeroScene3D module-scoped
      CSS compiles without warnings; /hero-3d-test route renders
      200 at dev-server probe with mock MotionValues; scene2
      illustration + content overlay reads AAA-legible against the
      new .scrim gradient at desktop (1440×900) + mobile (393×851)
      per apps/web/audit-d0048-hero3d.mjs + apps/web/audit-d0048-
      prod-hero.mjs scroll-position captures. Headless Chromium
      cannot sustain WebGL context (SwiftShader drops) so the actual
      parallax motion is confirmed in real-browser review via
      /hero-3d-test, not in CI.

      Confidence raised from 0.78 (first-pass D-0048) → 0.82
      (redesign). Steward browser review of /hero-3d-test would
      raise to 0.88+. Out-of-scope: ComfyUI re-roll of palms/fern
      sources (the existing mp4s are sufficient), hands-authored
