<?xml version="1.0" encoding="UTF-8"?>
<!--
  Largo Lawn — Apple touch icon (180x180 source).
  iOS 17+ Safari accepts SVG touch icons. Earlier iOS versions expect
  a raster PNG — when steward generates one, save it as
  /public/apple-touch-icon.png (180x180). The Next.js metadata icon
  block already references /apple-touch-icon.svg; for older iOS a
  raster fallback can be served via apple-touch-icon-precomposed.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Largo Lawn">
  <title>Largo Lawn</title>
  <!-- iOS renders the icon at native size with rounded corners; the OS
       applies the mask. Keep all art inside an inner ~160px circle. -->
  <!-- Background: brand palm-shadow. Real iOS clips to its own mask. -->
  <rect width="180" height="180" rx="40" ry="40" fill="#2D5A3D"/>

  <!-- Grass mark, scaled to ~120 wide, centered -->
  <g transform="translate(30 22) scale(1.2)" fill="#F4E8D0">
    <path d="M 50 78 Q 50 25 50 8 Q 50 25 50 78 Z" />
    <path d="M 32 78 Q 28 35 22 18 Q 30 38 38 78 Z" />
    <path d="M 68 78 Q 72 35 78 18 Q 70 38 62 78 Z" />
    <rect x="14" y="76" width="72" height="4" rx="2" />
  </g>

  <!-- Tiny sun accent, lower-right -->
  <circle cx="146" cy="142" r="14" fill="#E8B65A" opacity="0.9"/>
</svg>