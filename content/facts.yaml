# GRASS Business Plan Facts (PRP-A A-7 + S-01)
#
# Schema (per fact):
#   key:         kebab-case identifier
#   value:       the canonical value (number, percent, or string)
#   units:       currency / percent / count / string / etc.
#   source:      citation (must be a real, verifiable source)
#   effective:   ISO date the value became/will become canonical
#   review:      ISO date the value must be re-verified
#   confidence:  1-5 (5 = highest, sourced from primary docs)
#   scope:       where the fact applies ("all", "family-package", "long-plan",
#                "condensed-plan", "summary-card")
#   notes:       optional context
#
# Drift discipline:
#   - Every change to a fact MUST bump the version below.
#   - The lock file (output/reports/facts.lock.yaml) is a frozen snapshot of
#     the canonical state at the last successful build; the build gate
#     fails if facts.yaml drifts from facts.lock.yaml without a version bump.
#   - Operational artifacts (architecture/twin/invoice.md, content/templates/
#     invoice-template.md, research/regulatory/largo-licensing-map.yaml,
#     state/ledger.yaml) carry pre-correction values for some of these keys
#     and are flagged as D-0062 for the next reconciliation cycle.

version: "1.2.0"            # bump on any fact change (2026-07-28 v1.2: v3.0 AAA plan — added family-package-v3 facts; existing canonicals preserved)
facts_model_version: "v1"   # bump on schema change
locked_on: "2026-07-28"     # date of last lock

