<?xml version="1.0" encoding="UTF-8"?>
<!--
  D-0018 hand-authored section divider — wavy line with a small
  sun-gold dot mark in the center.

  Authored as SVG (not raster) so the stroke stays crisp at any
  rendered size. The 6px stroke is sized in the 1200x80 viewBox;
  at 720px wide display the rendered stroke is 3.6px (still
  crisp and intentional). The transparent background means the
  divider floats on any sand-bleached section without chroma keying.

  This is the right tool for the job: SDXL painted ornaments
  under ~200px tall are below quality bar (see memory
  2026-07-15); a hand-authored SVG with intentional stroke
  weight avoids that problem entirely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wavy line: gentle 1.5-cycle sine across 80% of the width -->
  <path
    d="M 120 40 C 200 28, 280 28, 360 40 S 520 52, 600 40 S 760 28, 840 40 S 1000 52, 1080 40"
    stroke="#E8B65A"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!-- Center mark: small filled circle in sun-gold with a slightly
       larger outer ring for editorial weight -->
  <circle cx="600" cy="40" r="4.5" fill="#E8B65A" stroke="none" />
  <circle cx="600" cy="40" r="9" fill="none" stroke="#C66B3A" stroke-width="1.5" />
</svg>
