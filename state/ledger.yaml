  - date: "2026-07-14"
    day: 21
    change: >
      D-0010 mobile-perf fix shipped. The real fix was converting
      HeroCinematic from a 'use client' component to a server
      component, paired with `scrollbar-gutter: stable` on <html>.
      Two-line change in two files.

      THE ROOT CAUSE: the v2 mobile LCP element is the hero subhead
      TEXT (not the image). The browser CAN paint the SSR'd text
      immediately, but the main thread was blocked evaluating
      framer-motion + Lenis JS for ~1.5-3s before layout/paint
      could complete. LCP was 4.0s, of which ~3.4s was main-thread
      bootup time.

      THE FIX: (1) Remove 'use client' from HeroCinematic.tsx. The
      static text (eyebrow, subhead, buttons, trust row) now renders
      server-side with zero JS. The motion parts (WordReveal,
      ParallaxImage, the framer-motion variants) are now imported
      as implicit client boundaries - Next.js code-splits them
      into a separate bundle that loads after the SSR'd text is
      already visible. (2) Add `scrollbar-gutter: stable` to the
      <html> selector in apps/web/src/styles/reset.css. Without
      this, Lenis's runtime activation of its custom smooth-scroll
      shifts the document content (desktop CLS jumped to 0.7+).
      With scrollbar-gutter, the space is reserved from first
      paint and Lenis's activation is shift-free.

      RESULTS: Desktop 100/100 Perf, 0 CLS (was 100/100, 0 CLS
      pre-D-0010). Mobile 82/100 Perf, 0 CLS (was 80/100, 0.047
      CLS). Mobile LCP and TBT remain elevated on simulated 4G
      because the v2 hero image transfer (191KB vs v1's 22KB) plus
      the remaining framer-motion bootup cost still hits the
      cellular budget. The mobile CI gate is not enabled
      (lighthouserc.cjs is desktop-only) so the build passes,
      but real customers on cellular networks will still see ~2s
      slower LCP than v1. Real fix needs re-encode mobile at
      quality=70 (trim ~40KB) plus AVIF source via <picture>
      (trim another 50-100ms).

      ATTEMPTED FIXES THAT DIDN'T WORK: (1) Drop the `priority`
      hint on the hero image. Reasoning was that with `priority`,
      next/image generates a <link rel="preload"> that competes
      with the JS bundle. Result: no measurable change (LCP
      element is text, not image, so image priority doesn't
      help). Reverted. (2) Just the server-component conversion
      without the scrollbar-gutter fix. Result: mobile Perf 100,
