<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mower equipment illustration. Editorial, consistent with homepage.
  Self-propelled walk-behind (typical 21" residential).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Self-propelled walk-behind lawn mower">
  <title>Mower</title>

  <!-- Soft sand background card -->
  <rect width="400" height="300" fill="#F4E8D0"/>

  <!-- Lawn ground -->
  <rect y="220" width="400" height="80" fill="#2D5A3D"/>
  <g opacity="0.18" stroke="#FAF6F0" stroke-width="2" fill="none">
    <path d="M 0 240 L 400 238"/>
    <path d="M 0 265 L 400 261"/>
    <path d="M 0 290 L 400 284"/>
  </g>

  <!-- Mower body -->
  <g transform="translate(80 90)">
    <!-- engine top (rear) -->
    <rect x="120" y="20" width="100" height="60" rx="10" fill="#1A1F1B"/>
    <rect x="135" y="32" width="70" height="35" rx="6" fill="#2D5A3D"/>
    <!-- grass catcher bag (rear) -->
    <path d="M 220 40 Q 240 0 260 40 L 250 80 L 230 80 Z" fill="#1A1F1B"/>
    <!-- deck -->
    <rect x="20" y="80" width="240" height="50" rx="12" fill="#1A1F1B"/>
    <rect x="40" y="80" width="200" height="14" fill="#2D5A3D"/>
    <!-- handle uprights -->
    <line x1="60" y1="80" x2="20" y2="0"
          stroke="#1A1F1B" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="80" x2="260" y2="0"
          stroke="#1A1F1B" stroke-width="10" stroke-linecap="round"/>
    <!-- handle grip -->
    <rect x="0" y="-12" width="40" height="10" rx="5" fill="#B5651D"/>
    <rect x="240" y="-12" width="40" height="10" rx="5" fill="#B5651D"/>
    <!-- wheels -->
    <circle cx="60" cy="148" r="22" fill="#1A1F1B"/>
    <circle cx="60" cy="148" r="9" fill="#3A2614"/>
    <circle cx="220" cy="148" r="22" fill="#1A1F1B"/>
    <circle cx="220" cy="148" r="9" fill="#3A2614"/>
    <!-- front caster -->
    <circle cx="140" cy="138" r="10" fill="#1A1F1B"/>
    <circle cx="140" cy="138" r="4" fill="#3A2614"/>
  </g>

  <!-- Brand mark (small) -->
  <g transform="translate(20 20) scale(0.25)" fill="#1F4E2C">
    <path d="M 50 78 Q 50 25 50 8 Q 50 25 50 78 Z"/>
    <path d="M 32 78 Q 28 35 22 18 Q 30 38 38 78 Z"/>
    <path d="M 68 78 Q 72 35 78 18 Q 70 38 62 78 Z"/>
    <rect x="14" y="76" width="72" height="4" rx="2"/>
  </g>

  <!-- Label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.7">
    <text x="120" y="36" font-size="14" font-weight="700" letter-spacing="2">MOWER</text>
  </g>
</svg>