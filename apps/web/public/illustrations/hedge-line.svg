<?xml version="1.0" encoding="UTF-8"?>
<!--
  hedge-line.svg — hero decoration for /services/hedge-trimming.
  Hand-drawn hedge row with one freshly-clipped panel revealing clean geometry.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — hedge row with one clipped panel">
  <title>Hedge row — before and after</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Sky band (subtle) -->
  <rect x="0" y="0" width="600" height="120" fill="#E5E0D8" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="320" width="600" height="80" fill="#1F4E2C" opacity="0.18"/>

  <!-- Tall unclipped hedge (left half) — wild, ragged silhouette -->
  <path d="M 20 320 L 20 200 Q 30 180 40 200 L 40 220 Q 50 190 60 215 L 60 195 Q 70 175 80 200 L 80 220 Q 90 185 100 210 L 100 195 Q 110 180 120 200 L 120 220 Q 130 190 140 210 L 140 200 Q 150 180 160 205 L 160 220 Q 170 195 180 215 L 180 200 Q 190 180 200 210 L 200 320 Z"
        fill="#1F4E2C" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Just-clipped hedge (middle-right) — clean, geometric silhouette -->
  <rect x="200" y="220" width="200" height="100" fill="#1F4E2C"
        stroke="#1A1F1B" stroke-width="3"/>

  <!-- Vertical edge highlights on clipped panel (texture lines) -->
  <g stroke="#1A1F1B" stroke-width="1" opacity="0.35">
    <line x1="220" y1="225" x2="220" y2="315"/>
    <line x1="250" y1="225" x2="250" y2="315"/>
    <line x1="280" y1="225" x2="280" y2="315"/>
    <line x1="310" y1="225" x2="310" y2="315"/>
    <line x1="340" y1="225" x2="340" y2="315"/>
    <line x1="370" y1="225" x2="370" y2="315"/>
  </g>

  <!-- Top trim line (clean cut) -->
  <line x1="200" y1="220" x2="400" y2="220" stroke="#5C4A3A"
        stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Wild hedge top accent dots (foliage detail) -->
  <g fill="#1F4E2C" opacity="0.6">
    <circle cx="30" cy="195" r="3"/>
    <circle cx="60" cy="190" r="3"/>
    <circle cx="90" cy="200" r="3"/>
    <circle cx="120" cy="195" r="3"/>
    <circle cx="150" cy="200" r="3"/>
    <circle cx="180" cy="195" r="3"/>
  </g>

  <!-- Clipped clippings scattered on ground -->
  <g fill="#1F4E2C" opacity="0.7">
    <ellipse cx="240" cy="350" rx="6" ry="2" transform="rotate(20 240 350)"/>
    <ellipse cx="260" cy="360" rx="5" ry="2" transform="rotate(-15 260 360)"/>
    <ellipse cx="290" cy="355" rx="7" ry="2" transform="rotate(30 290 355)"/>
    <ellipse cx="320" cy="365" rx="5" ry="2" transform="rotate(-25 320 365)"/>
    <ellipse cx="350" cy="350" rx="6" ry="2" transform="rotate(15 350 350)"/>
    <ellipse cx="380" cy="360" rx="5" ry="2" transform="rotate(-10 380 360)"/>
  </g>

  <!-- Hedge shears resting at right side -->
  <g transform="translate(460, 280)">
    <!-- Blades -->
    <path d="M 0 0 L 70 -10 L 75 -8 L 5 6 Z" fill="#8FA89B"
          stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 0 6 L 70 16 L 75 14 L 5 12 Z" fill="#8FA89B"
          stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Pivot bolt -->
    <circle cx="0" cy="3" r="5" fill="#1A1F1B"/>
    <circle cx="0" cy="3" r="2" fill="#E8B65A"/>
    <!-- Handles -->
    <path d="M -2 0 L -50 -22 L -55 -22 L -5 8 Z" fill="#B5651D"
          stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -2 6 L -50 28 L -55 28 L -5 12 Z" fill="#B5651D"
          stroke="#1A1F1B" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>