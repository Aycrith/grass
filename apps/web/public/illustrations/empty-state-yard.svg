<?xml version="1.0" encoding="UTF-8"?>
<!--
  EmptyState — generic "content not yet" placeholder.
  Hand-drawn grass blade + sun + cloud. Used when social.proof is
  empty (TestimonialQuote), when a real photo hasn't shipped yet, or
  when the steward deletes a `social.proof[]` entry mid-deploy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"
     aria-label="Illustration — grass blades and sun">
  <title>Empty state — content not yet available</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E8D0"/>
      <stop offset="1" stop-color="#FAF6F0"/>
    </linearGradient>
  </defs>

  <!-- Sand background -->
  <rect width="600" height="400" fill="url(#sky)" rx="20"/>

  <!-- Sun in upper right -->
  <circle cx="500" cy="80" r="36" fill="#E8B65A" opacity="0.85"/>
  <circle cx="500" cy="80" r="20" fill="#F6C673"/>

  <!-- Sun rays (sketch lines) -->
  <g stroke="#E8B65A" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="500" y1="20" x2="500" y2="0"/>
    <line x1="540" y1="40" x2="556" y2="22"/>
    <line x1="460" y1="40" x2="444" y2="22"/>
    <line x1="540" y1="120" x2="556" y2="138"/>
    <line x1="460" y1="120" x2="444" y2="138"/>
  </g>

  <!-- Hand-drawn grass cluster (organic, varied heights) -->
  <g stroke="#1F4E2C" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 200 360 Q 198 290 196 240"/>
    <path d="M 200 360 Q 220 290 224 230"/>
    <path d="M 200 360 Q 180 290 174 250"/>
    <path d="M 200 360 Q 240 290 256 240"/>
    <path d="M 200 360 Q 160 290 152 260"/>
  </g>
  <!-- secondary cluster -->
  <g stroke="#1F4E2C" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 380 360 Q 378 280 376 220"/>
    <path d="M 380 360 Q 400 280 404 220"/>
    <path d="M 380 360 Q 360 280 354 230"/>
    <path d="M 380 360 Q 420 280 432 230"/>
    <path d="M 380 360 Q 340 280 330 250"/>
  </g>

  <!-- Soil line -->
  <line x1="80" y1="360" x2="520" y2="360"
        stroke="#5C4A3A" stroke-width="3" stroke-linecap="round"/>
  <g fill="#5C4A3A">
    <circle cx="120" cy="370" r="3"/>
    <circle cx="200" cy="375" r="3"/>
    <circle cx="280" cy="370" r="3"/>
    <circle cx="360" cy="375" r="3"/>
    <circle cx="440" cy="370" r="3"/>
    <circle cx="500" cy="375" r="3"/>
  </g>

  <!-- "Coming soon" tiny label -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.55">
    <text x="300" y="160" font-size="16" font-weight="600"
          text-anchor="middle" letter-spacing="3">COMING SOON</text>
  </g>
</svg>