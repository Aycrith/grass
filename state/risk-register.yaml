      DRAFT pending steward ratification. Without steward action, the
      research cycle remains as drafts and no pilot activates. Risk:
      indefinite deferral of new business direction while Mission 1
      remains paused under D-0067/D-0068.
    likelihood: 4
    impact: 2
    risk_score: 8
    owner_agent: executive
    mitigation:
      - "22 reflection questions in D-0070 §9 framed as MCQ interview (file ready 2026-08-01)."
      - "Q5 framing question is the blocking ask; surfaces central-success-criterion uncertainty."
      - "State files (ledger, risk-register, capability-registry) updated to reflect research posture, not pilot activation."
      - "RESUMING.md still describes Mission 1 resumption; new business direction is independent path."
    mitigation_link: "governance/decisions/0070-pinellas-listing-media-pilot.md (DRAFT), output/research/2026-08-01_v6-ratification-reset-synthesis.md"
    detection_signal: "D-0070 status remains DRAFT >14 days after steward interview prompt"
    review_date: "2026-08-30"

  - risk_id: R-LM-002
    title: "Pinellas Listing Media market turns out to be saturated post-launch"
    description: >
      Per DRAFT D-0070 §7: v4 saturation finding enumerated 26+ verified
      competitors in Pinellas County (SkyView Tampa Bay, Tyto, Virtuals1,
      TruFusion, CS3, ProMedia, Luxury Listing Specialists, Suncoast
      Media, etc.). Risk: pricing power collapses further or competitors
      undercut the $250-$300 entry tier before pilot completes.
    likelihood: 3
    impact: 4
    risk_score: 12
    owner_agent: marketing
    mitigation:
      - "Pilot success criterion is NOT zero competitors — it's paid bookings AND ≥$30/hr averaged."
      - "Twilight add-on ($150) differentiates on timing; competing with daylight-only operators."
      - "Channel-agnostic distribution (D-0070 §0.4) avoids betting on single channel that competitors own."
      - "Hard kill-switch at $300 spend cap (D-0070 §0.3) prevents runaway loss."
    mitigation_link: "governance/decisions/0070-pinellas-listing-media-pilot.md (DRAFT) §0.6, §7"
    detection_signal: "Inbound inquiries flat or declining at Day 7 OR competitor pricing under $200 entry"
    review_date: "2026-08-30"

  - risk_id: R-LM-003
    title: "Steward cannot sustain $40/hr averaged margin during pilot"
    description: >
      Per DRAFT D-0070 §0.6 (per §9.1 Q5 framing answer 2026-08-01 letter b):
      success criterion includes ≥$40/hr averaged across all booked
      engagements. Risk: hours-burned (drone flight time, editing,
      listing prep, client comms) exceeds bookings revenue, margin
      drops below threshold, pilot aborts at Day 14.
    likelihood: 3
    impact: 3
    risk_score: 9
    owner_agent: operations
    mitigation:
      - "Day-1 hour tracking against bookings revenue (entry $250-$300)."
      - "Day 14 hard review: if margin <$40/hr AND <3 paid bookings, pause and redesign (D-0070 §6)."
      - "Premium-tier evidence threshold (≥5 paid bookings at $300+) before scaling (D-0070 §0.8)."
      - "Aggregation rule: simple mean of all bookings (D-0070 §0.11)."
    mitigation_link: "governance/decisions/0070-pinellas-listing-media-pilot.md (DRAFT) §0.6, §0.8, §0.11, §6, §9.1"
    detection_signal: "Day-7 mid-pilot margin <$30/hr OR hours-burned exceeds bookings revenue"
    review_date: "2026-08-30"

