<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" role="img" aria-label="Pressed specimen of St. Augustinegrass, Stenotaphrum secundatum, Floratam cultivar">
  <title>St. Augustinegrass — Stenotaphrum secundatum</title>

  <!-- Aged paper background (sepia cream) -->
  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

  <!-- Subtle press rings (concentric circles) -->
  <g opacity="0.08" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.0">
    <circle cx="170" cy="160" r="125" />
    <circle cx="170" cy="160" r="105" />
    <circle cx="170" cy="160" r="85" />
    <circle cx="170" cy="160" r="65" />
  </g>

  <!-- Border line (museum mounting sheet) -->
  <rect x="14" y="14" width="312" height="312" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" opacity="0.55" />

  <!-- St. Augustine seedhead (flat scaly spike) -->
  <g transform="translate(170 86)">
    <!-- Spike outline (rounded teardrop) -->
    <path d="M -2.5 -2 Q -3 -10 -2.5 -20 Q -1 -32 0 -40 Q 1 -32 2.5 -20 Q 3 -10 2.5 -2 Z"
          fill="var(--ll-aged-paper, #ede4d0)" fill-opacity="0.75" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <!-- Scale cross-hatches -->
    <line x1="-2" y1="-8" x2="2" y2="-8" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.75" />
    <line x1="-2.2" y1="-14" x2="2.2" y2="-14" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.75" />
    <line x1="-2" y1="-20" x2="2" y2="-20" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.75" />
    <line x1="-1.7" y1="-26" x2="1.7" y2="-26" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.75" />
    <line x1="-1.4" y1="-32" x2="1.4" y2="-32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.75" />
  </g>

  <!-- 5 BROAD blades with ROUNDED tips (line art + very light olive wash) -->
  <!-- Blade 1: leftmost, leaning left -->
  <g>
    <path d="M 170 220 Q 156 170 148 100 Q 146 90 152 88 Q 158 90 158 100 Q 162 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <!-- Veining (parallel lines down the blade) -->
    <line x1="153" y1="100" x2="166" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.95" />
    <line x1="155" y1="100" x2="168" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
    <line x1="151" y1="105" x2="164" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.65" />
  </g>

  <!-- Blade 2: left-center, slight curve -->
  <g>
    <path d="M 170 220 Q 164 160 162 90 Q 162 80 168 78 Q 174 80 174 90 Q 172 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="168" y1="90" x2="170" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.95" />
    <line x1="165" y1="95" x2="167" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
    <line x1="171" y1="95" x2="173" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
  </g>

  <!-- Blade 3: center-tallest, straight up (with seedhead) -->
  <g>
    <path d="M 170 220 Q 170 150 170 86 L 170 76 L 174 74 L 178 76 L 178 86 Q 176 150 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="174" y1="86" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.95" />
    <line x1="172" y1="90" x2="172" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
    <line x1="176" y1="90" x2="176" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
  </g>

  <!-- Blade 4: right-center, slight curve -->
  <g>
    <path d="M 170 220 Q 176 160 178 90 Q 178 80 184 78 Q 190 80 188 90 Q 182 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="180" y1="90" x2="180" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.95" />
    <line x1="183" y1="95" x2="183" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
    <line x1="186" y1="95" x2="186" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
  </g>

  <!-- Blade 5: rightmost, leaning right -->
  <g>
    <path d="M 170 220 Q 184 170 192 100 Q 194 90 188 88 Q 182 90 182 100 Q 178 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="187" y1="100" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.55" opacity="0.95" />
    <line x1="185" y1="100" x2="172" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.55" />
    <line x1="189" y1="105" x2="176" y2="200" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.45" opacity="0.65" />
  </g>

  <!-- STOLONS (above-ground runners) — diagnostic for St. Augustine (no rhizomes) -->
  <!-- Left stolon, thick (St. Augustine stolons are THICK and visible) -->
  <path d="M 170 224 Q 130 232 90 244 Q 70 248 50 256"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="2.8" stroke-linecap="round" />
  <!-- Stolon nodes -->
  <circle cx="130" cy="232" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="90" cy="244" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <!-- Right stolon -->
  <path d="M 170 224 Q 210 232 250 244 Q 270 248 290 256"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="210" cy="232" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="250" cy="244" r="2" fill="var(--ll-sepia, #5a3e1f)" />
  <!-- A new shoot emerging from one stolon node -->
  <g transform="translate(90 244)">
    <line x1="0" y1="0" x2="-2" y2="-8" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" stroke-linecap="round" />
    <path d="M -2 -8 Q -5 -4 -6 0 L -3 1 L -1 -7 Z" fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.0" />
  </g>

  <!-- Soil line -->
  <line x1="40" y1="252" x2="300" y2="252" stroke="var(--ll-soil, #8a6a3a)" stroke-width="1.1" stroke-dasharray="2 3" opacity="0.75" />

  <!-- Small root squiggles BELOW the soil line (stolons root down, no rhizomes) -->
  <path d="M 130 252 Q 132 258 128 264 Q 130 268 126 272" fill="none" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.9" opacity="0.65" />
  <path d="M 210 252 Q 212 258 208 264 Q 210 268 206 272" fill="none" stroke="var(--ll-soil, #8a6a3a)" stroke-width="0.9" opacity="0.65" />

  <!-- Corner stamp (clay) - top-left -->
  <g transform="translate(28 32) rotate(-3)" opacity="0.95">
    <rect x="0" y="0" width="50" height="22" fill="none" stroke="var(--ll-clay, #b5651d)" stroke-width="1.1" rx="2" />
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="var(--ll-clay, #b5651d)">FL-04</text>
  </g>

  <!-- Specimen tag (lower-right) -->
  <g transform="translate(170 276)">
    <rect x="0" y="0" width="160" height="50" fill="var(--ll-label-tan, #f0e6d0)" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <text x="6" y="13" font-family="Georgia, serif" font-size="9" font-style="italic" fill="var(--ll-sepia, #5a3e1f)">Stenotaphrum secundatum</text>
    <text x="6" y="24" font-family="sans-serif" font-size="7.5" fill="var(--ll-sepia, #5a3e1f)">St. Augustinegrass · Floratam</text>
    <text x="6" y="34" font-family="sans-serif" font-size="6.5" fill="var(--ll-sepia, #5a3e1f)" opacity="0.95">3.5–4.0 in · weekly · stolons</text>
    <text x="6" y="44" font-family="sans-serif" font-size="6" fill="var(--ll-sepia, #5a3e1f)" opacity="0.95">Largo FL · 2026-07-21</text>
  </g>
</svg>
