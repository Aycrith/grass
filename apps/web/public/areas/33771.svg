<?xml version="1.0" encoding="UTF-8"?>
<!--
  33771 — East Largo / Downtown corridor.
  Composition: tree-lined residential street, sidewalk strips,
  characteristic mid-century ranch homes with screened porches,
  the brand's "home ZIP" — most recurring on the route.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="33771 — East Largo residential">
  <title>33771 — East Largo</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B65A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F4E8D0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="450" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="950" cy="160" r="90" fill="#F6C673" opacity="0.85"/>
  <circle cx="950" cy="160" r="40" fill="#E8B65A"/>

  <!-- Distant treeline -->
  <rect y="380" width="1200" height="60" fill="#3A6B45"/>
  <g fill="#3A6B45">
    <circle cx="80" cy="380" r="40"/>
    <circle cx="200" cy="380" r="46"/>
    <circle cx="340" cy="380" r="42"/>
    <circle cx="460" cy="380" r="50"/>
    <circle cx="600" cy="380" r="44"/>
    <circle cx="720" cy="380" r="48"/>
    <circle cx="860" cy="380" r="44"/>
    <circle cx="980" cy="380" r="50"/>
    <circle cx="1120" cy="380" r="44"/>
  </g>

  <!-- Lawn strip -->
  <rect y="440" width="1200" height="40" fill="#2D5A3D"/>

  <!-- Sidewalk -->
  <rect y="480" width="1200" height="36" fill="#A8A8A0"/>

  <!-- Curb edge between sidewalk and street -->
  <rect y="516" width="1200" height="6" fill="#FAF6F0"/>
  <rect y="522" width="1200" height="153" fill="#5C5C56"/>

  <!-- Street center divider -->
  <g stroke="#FAF6F0" stroke-width="3" stroke-dasharray="20 18" opacity="0.6">
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Sidewalk cracks -->
  <g stroke="#6E6E68" stroke-width="1" fill="none" opacity="0.5">
    <line x1="120" y1="480" x2="150" y2="516"/>
    <line x1="320" y1="480" x2="340" y2="516"/>
    <line x1="540" y1="480" x2="560" y2="516"/>
    <line x1="760" y1="480" x2="780" y2="516"/>
    <line x1="980" y1="480" x2="1000" y2="516"/>
  </g>

  <!-- Mid-century ranch home (left), screened porch characteristic -->
  <g transform="translate(160 200)">
    <!-- main body -->
    <rect x="0" y="60" width="240" height="180" fill="#D4A574"/>
    <!-- low-slope roof -->
    <polygon points="0,60 120,30 240,60" fill="#5C4A3A"/>
    <!-- screened porch addition -->
    <rect x="-60" y="120" width="60" height="120" fill="#FAF6F0" opacity="0.85"/>
    <rect x="-60" y="120" width="60" height="6" fill="#5C4A3A"/>
    <rect x="-60" y="180" width="60" height="6" fill="#5C4A3A"/>
    <rect x="-60" y="240" width="60" height="6" fill="#5C4A3A"/>
    <!-- windows -->
    <rect x="40" y="100" width="40" height="40" fill="#1A1F1B" opacity="0.55"/>
    <rect x="120" y="100" width="40" height="40" fill="#1A1F1B" opacity="0.55"/>
    <!-- door -->
    <rect x="180" y="160" width="30" height="80" fill="#1A1F1B"/>
    <!-- drive/walkway -->
    <rect x="100" y="240" width="60" height="40" fill="#A8A8A0"/>
  </g>

  <!-- Two-story home (right) with palm -->
  <g transform="translate(720 160)">
    <!-- body -->
    <rect x="0" y="80" width="260" height="160" fill="#F4E8D0"/>
    <rect x="0" y="80" width="260" height="6" fill="#5C4A3A"/>
    <rect x="0" y="160" width="260" height="6" fill="#D4A574"/>
    <!-- hip roof -->
    <polygon points="0,80 130,30 260,80" fill="#5C4A3A"/>
    <!-- garage -->
    <rect x="20" y="180" width="100" height="60" fill="#FAF6F0"/>
    <rect x="140" y="120" width="40" height="50" fill="#1A1F1B" opacity="0.55"/>
    <rect x="200" y="120" width="40" height="50" fill="#1A1F1B" opacity="0.55"/>
    <rect x="80" y="180" width="20" height="60" fill="#1A1F1B"/>
  </g>

  <!-- Palm next to second home -->
  <g transform="translate(660 220)">
    <rect x="0" y="120" width="6" height="100" fill="#5C4A3A"/>
    <g fill="#2D5A3D" transform="translate(3 100)">
      <ellipse cx="0" cy="0" rx="40" ry="6" transform="rotate(-20)"/>
      <ellipse cx="20" cy="-12" rx="34" ry="6" transform="rotate(0)"/>
      <ellipse cx="-20" cy="-12" rx="34" ry="6" transform="rotate(20)"/>
      <ellipse cx="30" cy="6" rx="28" ry="6" transform="rotate(35)"/>
      <ellipse cx="-30" cy="6" rx="28" ry="6" transform="rotate(-35)"/>
    </g>
  </g>

  <!-- Tree with driveway -->
  <g transform="translate(80 240)">
    <rect x="-40" y="80" width="14" height="120" fill="#5C4A3A"/>
    <ellipse cx="-33" cy="60" rx="60" ry="60" fill="#3A6B45"/>
    <ellipse cx="-33" cy="20" rx="50" ry="50" fill="#2D5A3D"/>
  </g>

  <!-- Mailbox -->
  <g transform="translate(540 380)">
    <rect x="-2" y="0" width="4" height="60" fill="#5C4A3A"/>
    <rect x="-12" y="-12" width="24" height="20" rx="2" fill="#1A1F1B"/>
  </g>

  <!-- ZIP badge -->
  <g font-family="Inter, system-ui, sans-serif" fill="#1A1F1B" opacity="0.85">
    <text x="40" y="60" font-size="14" font-weight="700"
          fill="#B5651D" letter-spacing="3">EAST LARGO · 33771</text>
  </g>

  <!-- Faint "photo soon" marker, low-contrast -->
  <g font-family="Inter, system-ui, sans-serif" fill="#FAF6F0" opacity="0.42">
    <text x="40" y="660" font-size="13" letter-spacing="3">PHOTO COMING SOON</text>
  </g>
</svg>