  - date: "2026-07-20"
    day: 27
    decision: D-0049-rev-3
    decision_subrecord: "Fix fern + songbirds black-letterbox bleed"
    title: "D-0049 rev 3 — re-encode fern-01..06 + songbirds-01..06 WebP with alpha channel (black letterbox → transparent)"
    summary: >
      After the rev 2 palms removal, the steward flagged a dark vertical
      column at ~50% of panel width on the storybook stage (separate
      from the D-0048 Three.js column; visible through the cartoon
      itself, not below it). Root cause: .fernWrap and .songbirdsWrap
      apply mix-blend-mode: multiply, and the fern-01..06.webp /
      songbirds-01..06.webp assets are VEO extractions encoded as RGB
      WebP WITHOUT an alpha channel — the painted scene has black
      letterbox bars on the left and right sides. Under multiply, black
      × any-color = black, so the letterbox bled through as a solid
      dark column at the left edge of the songbirds image (visible at
      ~50% of panel width on the storybook stage and through the
      [0.10, 0.40] cross-fade window). Fix: re-encode all 12 fern +
      songbirds WebP files with the solid-black pixels (R+G+B < 30)
      converted to alpha=0. Threshold preserves the dark-green palm
      leaves and hill shadows at full opacity (their RGB sums are
      120-210). Idempotent script at
      apps/web/scripts/fix-v2-asset-letterbox.py. Visual evidence in
      apps/web/audit/d-0049-second-scene/hero-y*.png — the dark column
      is gone, the painted palm + birds are now visible as foreground
      parallax depth over the cartoon.
    by: "Mavis (orchestrator, 2026-07-20)"
    review_date: "2026-10-10"
    twined_with: "D-0049 (parent); D-0044 (fern/songbirds parallax layer creator)"

  - date: "2026-07-20"
    day: 27
    decision: D-0049-rev-4
    decision_subrecord: "Remove FernLayer + SongbirdsLayer from storybook (style mismatch)"
    title: "D-0049 rev 4 — remove FernLayer + SongbirdsLayer from storybook JSX; painted parallax clashed with hand-authored SVG cartoon"
    summary: >
      The D-0049 rev 3 fix made the songbirds-01..06.webp / fern-01..06.webp
      content fully visible (black letterbox was the only thing hiding the
      painted detail). The next steward review flagged that the painted
      brushwork palm + brushwork leaves + painted birds did NOT match the
      hand-authored SVG cartoon's flat-vector style — they read as a
      separate painting pasted on top of the cartoon, not as foreground
      depth. Two completely different visual languages mashed together.
      Fix: removed <FernLayer /> and <SongbirdsLayer /> from the
      HeroStorybookLayer JSX. The cartoon storybook already has its own
      depth cascade (sky + drifting clouds + far palms + swaying mid
      palms + ranch houses + foreground grass + wildflowers); the
      painted parallax was unnecessary "more is more" that broke
      coherence. The FernLayer/SongbirdsLayer function components, the
      useViewportMotion subscription, the CSS, and the WebP assets all
      stay in the repo (in case future re-painted-cartoon-style assets
      want to be slotted back in). Visual evidence:
      apps/web/audit/d-0049-second-scene/hero-y0.png — clean flat-vector
      cartoon, all elements in the same hand-authored style, no painted
      parallax clashing.
    by: "Mavis (orchestrator, 2026-07-20)"
    review_date: "2026-10-10"
    twined_with: "D-0049 (parent); D-0044 (fern/songbirds parallax layer creator, original Wave 3 addition)"

