<?xml version="1.0" encoding="UTF-8"?>
<!--
  Largo Lawn — Apple touch icon (180x180 source).
  iOS 17+ Safari accepts SVG touch icons. Earlier iOS versions expect
  a raster PNG — when steward generates one, save it as
  /public/apple-touch-icon.png (180x180).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Largo Lawn">
  <title>Largo Lawn</title>

  <!-- Background: deep palm green -->
  <rect width="180" height="180" rx="40" ry="40" fill="#2D5A3D"/>

  <!-- Palm tree icon, centered, ~100px tall -->
  <g transform="translate(50 38)">
    <!-- Trunk -->
    <path
      d="M 40 110 C 40 110 38 70 42 48 Q 44 40 46 48 C 50 70 48 110 48 110 Z"
      fill="#F4E8D0"
    />

    <!-- Frond 1 — top center -->
    <path d="M 43 46 Q 43 28 43 14 Q 52 28 43 46 Z" fill="#F4E8D0" />

    <!-- Frond 2 — upper right -->
    <path d="M 43 46 Q 66 24 80 18 Q 65 32 43 46 Z" fill="#F4E8D0" />

    <!-- Frond 3 — right -->
    <path d="M 44 48 Q 68 50 80 46 Q 65 54 44 48 Z" fill="#F4E8D0" />

    <!-- Frond 4 — upper left -->
    <path d="M 42 46 Q 20 24 6 18 Q 20 32 42 46 Z" fill="#F4E8D0" />

    <!-- Frond 5 — left -->
    <path d="M 41 48 Q 18 50 6 46 Q 22 54 41 48 Z" fill="#F4E8D0" />

    <!-- Coconuts — warm gold -->
    <circle cx="40" cy="50" r="4" fill="#E8B65A" />
    <circle cx="46" cy="50" r="4" fill="#E8B65A" />
    <circle cx="43" cy="55" r="4" fill="#E8B65A" />
  </g>

  <!-- Brand name below icon — small, cream -->
  <text
    x="90"
    y="165"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
    font-size="22"
    font-weight="600"
    fill="#F4E8D0"
    letter-spacing="0.05em"
  >LARGO LAWN</text>
</svg>
