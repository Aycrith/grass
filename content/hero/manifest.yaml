# Hero asset manifest — every visual + audio asset the landing-page
# hero uses, where it came from, what license it carries, and what
# component consumes it. Update this file when you add, remove, or
# repurpose an asset. CI lint will eventually enforce schema validity
# (https://github.com/...; tracked in the steward backlog).
#
# Schema (per entry):
#   id:          short slug, kebab-case
#   filename:    path under apps/web/public/, relative
#   tier:        one of A | B | C | D | E | F (see INTENT.md §2)
#   kind:        image | video | audio | svg
#   format:      webp | avif | jpg | png | svg | mp4 | mp3
#   size_bytes:  integer (informational, not enforced)
#   dimensions:  WIDTHxHEIGHT (omit for audio)
#   duration_s:  integer (videos and audio only)
#   source:      provenance — original file path + how it was produced
#   license:     one of internal | veo-v3 | cc0 | public-domain
#   status:      active | reserved | orphan | removed
#   used_by:     component(s) that import or reference the asset
#   notes:       free-form (crop values, color palette, decisions, etc.)

# ============================================================
# Tier A — Hand-authored SVG cartoon (Scene 1)
# ============================================================
# These are inlined SVG components in apps/web/src/components/sections/
# HeroStorybookLayer.tsx — they don't have a "file" in /public/ because
# they're React primitives. Documented here for completeness.
- id: hero-sky
  tier: A
  kind: svg
  format: svg
  source: hand-authored in HeroStorybookLayer.tsx → BackgroundSky()
  license: internal
  status: active
  used_by:
    - apps/web/src/components/sections/HeroStorybookLayer.tsx
  notes: |
    The animated sunset sky. 4-layer sunburst (halo + 8 long rays +
    8 short rays + warm core), drifting clouds (4 cloud sprites with
    different drift cadences). All hand-authored flat-fill SVG.
    Reduced-motion: all animations collapse to identity.

- id: hero-far-palms
  tier: A
  kind: svg
  format: svg
  source: hand-authored in HeroStorybookLayer.tsx → FarLayer()
  license: internal
  status: active
  used_by:
    - apps/web/src/components/sections/HeroStorybookLayer.tsx
  notes: |
    7 distant palm trees + 3 faint ranch houses. Translates 3%
    per 0.10 scroll unit. 14s group-level "distant grove
    breathing" sway via .farPalmsSway.

- id: hero-mid-palms
  tier: A
  kind: svg
  format: svg
  source: hand-authored in HeroStorybookLayer.tsx → MidLayer()
  license: internal
  status: active
  used_by:
    - apps/web/src/components/sections/HeroStorybookLayer.tsx
  notes: |
    3 closer palms (swaying, per-part physics-coherent rotation
    around the trunk-top attach point) + 3 ranch houses. The
    left palm is taller (h=170) than middle/right (h=130) to
    establish the depth hierarchy. Per-palm `phase` keeps the
    three palms out of lockstep.

- id: hero-near-grass
  tier: A
  kind: svg
  format: svg
  source: hand-authored in HeroStorybookLayer.tsx → NearLayer()
  license: internal
  status: active
  used_by:
    - apps/web/src/components/sections/HeroStorybookLayer.tsx
  notes: |
    60 grass blade <g> elements with .blade class + per-blade
    --i custom property for staggered phase. 2.6s period,
    ±3.5° rotation around the base. The 0.11s phase spread
    across 60 blades gives a 6.6s phase window — wind moving
    across the lawn, not 60 blades in lockstep.

- id: hero-grass-silhouette
  tier: A
  kind: svg
  format: svg
  source: hand-authored in HeroFieldTelemetry.tsx → grassSilhouette
  license: internal
  status: active
  used_by:
    - apps/web/src/components/sections/HeroFieldTelemetry.tsx
  notes: |
    Static foreground grass blade SVG (1200x120 viewBox) along
    the bottom edge of the photo layer. Rises in across
    [0.10, 0.30] and fades out across [0.40, 0.70] to make
    room for scene 2.

