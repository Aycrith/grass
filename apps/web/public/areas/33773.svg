  <rect y="440" width="1200" height="80" fill="#2D5A3D"/>
  <rect y="520" width="1200" height="36" fill="#A8A8A0"/>
  <rect y="556" width="1200" height="6" fill="#FAF6F0"/>
  <rect y="562" width="1200" height="113" fill="#3A3A36"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#FAF6F0" stroke-width="3" stroke-dasharray="20 18" opacity="0.55"/>

  <g transform="translate(40 380)">
    <rect x="-3" y="0" width="6" height="60" fill="#5C4A3A"/>
    <g fill="#2D5A3D" transform="translate(0 0)">
      <ellipse cx="0" cy="0" rx="30" ry="5" transform="rotate(-20)"/>
      <ellipse cx="20" cy="-8" rx="26" ry="5" transform="rotate(0)"/>
      <ellipse cx="-20" cy="-8" rx="26" ry="5" transform="rotate(20)"/>
    </g>
  </g>
  <g transform="translate(1160 380)">
    <rect x="-3" y="0" width="6" height="60" fill="#5C4A3A"/>
    <g fill="#2D5A3D">
      <ellipse cx="0" cy="0" rx="30" ry="5" transform="rotate(-20)"/>
      <ellipse cx="20" cy="-8" rx="26" ry="5" transform="rotate(0)"/>
      <ellipse cx="-20" cy="-8" rx="26" ry="5" transform="rotate(20)"/>
    </g>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="60" font-size="14" font-weight="700"
          fill="#B5651D" letter-spacing="3">NORTHEAST LARGO · 33773</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" fill="#FAF6F0" opacity="0.42">
    <text x="40" y="660" font-size="13" letter-spacing="3">PHOTO COMING SOON</text>
  </g>
