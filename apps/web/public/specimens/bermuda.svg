<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" role="img" aria-label="Pressed specimen of Bermudagrass, Cynodon dactylon">
  <title>Bermudagrass — Cynodon dactylon</title>

  <!-- Aged paper background -->
  <rect x="0" y="0" width="340" height="340" fill="var(--ll-aged-paper, #ede4d0)" />

  <!-- Press rings -->
  <g opacity="0.08" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.0">
    <circle cx="170" cy="160" r="125" />
    <circle cx="170" cy="160" r="105" />
    <circle cx="170" cy="160" r="85" />
    <circle cx="170" cy="160" r="65" />
  </g>

  <!-- Border -->
  <rect x="14" y="14" width="312" height="312" fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" opacity="0.95" />

  <!-- BERMUDA SEEDHEAD: 3 finger-like spikes at the top (diagnostic) -->
  <g transform="translate(170 90)">
    <!-- Stalk to fork -->
    <line x1="0" y1="0" x2="0" y2="-6" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.0" stroke-linecap="round" />
    <!-- Spike 1 (left, angled) -->
    <g transform="rotate(-32)">
      <line x1="0" y1="-6" x2="0" y2="-32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.65">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
      </g>
    </g>
    <!-- Spike 2 (center, taller) -->
    <g>
      <line x1="0" y1="-6" x2="0" y2="-40" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.65">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
        <line x1="-0.5" y1="-30" x2="0.5" y2="-30" />
        <line x1="-0.4" y1="-34" x2="0.4" y2="-34" />
      </g>
    </g>
    <!-- Spike 3 (right, angled) -->
    <g transform="rotate(32)">
      <line x1="0" y1="-6" x2="0" y2="-30" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" stroke-linecap="round" />
      <g stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.65">
        <line x1="-0.5" y1="-10" x2="0.5" y2="-10" />
        <line x1="-0.5" y1="-14" x2="0.5" y2="-14" />
        <line x1="-0.5" y1="-18" x2="0.5" y2="-18" />
        <line x1="-0.5" y1="-22" x2="0.5" y2="-22" />
        <line x1="-0.5" y1="-26" x2="0.5" y2="-26" />
      </g>
    </g>
  </g>

  <!-- 7 FINE blades with POINTED tips (line art + light wash) -->
  <!-- Blade 1: leftmost, leaning left -->
  <g>
    <path d="M 170 220 Q 156 170 148 110 L 146 102 L 150 100 L 152 110 Q 162 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="149" y1="110" x2="166" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 2: left -->
  <g>
    <path d="M 170 220 Q 162 160 160 100 L 159 90 L 162 88 L 164 100 Q 168 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="162" y1="100" x2="170" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 3: center-left -->
  <g>
    <path d="M 170 220 Q 168 150 166 80 L 165 70 L 168 68 L 170 80 Q 172 150 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="168" y1="80" x2="170" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 4: center-tallest (with seedhead) -->
  <g>
    <path d="M 170 220 Q 170 140 170 90 L 170 50 L 173 48 L 176 50 L 176 90 Q 174 140 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="173" y1="60" x2="173" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 5: center-right -->
  <g>
    <path d="M 170 220 Q 172 150 174 80 L 175 70 L 178 68 L 181 70 L 180 80 Q 178 150 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="178" y1="80" x2="178" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 6: right -->
  <g>
    <path d="M 170 220 Q 178 160 180 100 L 181 90 L 184 88 L 187 90 L 186 100 Q 182 160 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="184" y1="100" x2="178" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>
  <!-- Blade 7: rightmost, leaning right -->
  <g>
    <path d="M 170 220 Q 184 170 192 110 L 194 102 L 198 100 L 200 102 L 198 110 Q 188 170 170 220 Z"
          fill="var(--ll-olive, #6b7d4a)" fill-opacity="0.32" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <line x1="196" y1="110" x2="174" y2="210" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.2" opacity="0.95" />
  </g>

  <!-- BOTH stolons AND rhizomes (Bermuda's diagnostic feature) -->
  <!-- Stolons above soil (thin, wiry) -->
  <path d="M 170 220 Q 130 225 80 232 Q 60 236 40 240"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 170 220 Q 210 225 260 232 Q 280 236 300 240"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="125" cy="226" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="215" cy="226" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- Soil line -->
  <line x1="40" y1="245" x2="300" y2="245" stroke="var(--ll-soil, #8a6a3a)" stroke-width="1.1" stroke-dasharray="2 3" opacity="0.75" />

  <!-- RHIZOMES below soil (Bermuda has these too — the second diagnostic feature) -->
  <path d="M 170 248 Q 130 254 90 260 Q 70 264 50 270"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 170 248 Q 210 254 250 260 Q 270 264 290 270"
        fill="none" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="130" cy="254" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="210" cy="254" r="1.4" fill="var(--ll-sepia, #5a3e1f)" />
  <circle cx="170" cy="248" r="1.6" fill="var(--ll-sepia, #5a3e1f)" />

  <!-- Corner stamp -->
  <g transform="translate(28 32) rotate(-3)" opacity="0.95">
    <rect x="0" y="0" width="50" height="22" fill="none" stroke="var(--ll-clay, #b5651d)" stroke-width="1.1" rx="2" />
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="var(--ll-clay, #b5651d)">FL-04</text>
  </g>

  <!-- Specimen tag -->
  <g transform="translate(170 278)">
    <rect x="0" y="0" width="160" height="50" fill="var(--ll-label-tan, #f0e6d0)" stroke="var(--ll-sepia, #5a3e1f)" stroke-width="0.9" />
    <text x="6" y="13" font-family="Georgia, serif" font-size="9" font-style="italic" fill="var(--ll-sepia, #5a3e1f)">Cynodon dactylon</text>
    <text x="6" y="24" font-family="sans-serif" font-size="7.5" fill="var(--ll-sepia, #5a3e1f)">Bermudagrass</text>
    <text x="6" y="34" font-family="sans-serif" font-size="6.5" fill="var(--ll-sepia, #5a3e1f)" opacity="0.95">1.0–2.0 in · 3–5 days · stolons + rhizomes</text>
    <text x="6" y="44" font-family="sans-serif" font-size="6" fill="var(--ll-sepia, #5a3e1f)" opacity="0.95">Largo FL · 2026-07-21</text>
  </g>
</svg>
