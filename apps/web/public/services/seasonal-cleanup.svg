<?xml version="1.0" encoding="UTF-8"?>
<!--
  Seasonal cleanup illustration. EarthSlice editorial.
  Composition: falling leaves + rake in foreground + leaf pile.
  Warm ochre / clay palette. October feel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
     aria-label="Seasonal cleanup — leaves and rake">
  <title>Seasonal cleanup</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A574"/>
      <stop offset="1" stop-color="#F4E8D0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B4A1E"/>
      <stop offset="1" stop-color="#3A2614"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="540" fill="url(#sky)"/>

  <!-- Distant lawn strip + curb -->
  <rect y="380" width="1600" height="160" fill="#3A6B45"/>
  <rect y="378" width="1600" height="6" fill="#FAF6F0"/>

  <!-- Ground (earth + leaf pile base) -->
  <rect y="540" width="1600" height="360" fill="url(#ground)"/>

  <!-- Leaf pile, big rounded form -->
  <g fill="#B5651D">
    <ellipse cx="800" cy="780" rx="780" ry="120"/>
    <ellipse cx="640" cy="740" rx="380" ry="80"/>
    <ellipse cx="960" cy="740" rx="380" ry="80"/>
  </g>
  <g fill="#D4A574" opacity="0.7">
    <ellipse cx="700" cy="700" rx="300" ry="50"/>
    <ellipse cx="900" cy="700" rx="300" ry="50"/>
  </g>
  <g fill="#8B4A1E" opacity="0.85">
    <ellipse cx="600" cy="800" rx="240" ry="40"/>
    <ellipse cx="1000" cy="800" rx="240" ry="40"/>
  </g>

  <!-- Falling leaves, scattered -->
  <g fill="#B5651D">
    <ellipse cx="200" cy="180" rx="32" ry="14" transform="rotate(30 200 180)"/>
    <ellipse cx="380" cy="260" rx="28" ry="12" transform="rotate(-20 380 260)"/>
    <ellipse cx="540" cy="160" rx="30" ry="13" transform="rotate(45 540 160)"/>
    <ellipse cx="720" cy="220" rx="26" ry="12" transform="rotate(15 720 220)"/>
    <ellipse cx="900" cy="140" rx="32" ry="14" transform="rotate(-30 900 140)"/>
    <ellipse cx="1080" cy="200" rx="28" ry="12" transform="rotate(20 1080 200)"/>
    <ellipse cx="1280" cy="160" rx="30" ry="13" transform="rotate(40 1280 160)"/>
    <ellipse cx="1440" cy="240" rx="26" ry="12" transform="rotate(-25 1440 240)"/>
  </g>
  <g fill="#D4A574">
    <ellipse cx="280" cy="340" rx="28" ry="12" transform="rotate(60 280 340)"/>
    <ellipse cx="480" cy="380" rx="30" ry="13" transform="rotate(-45 480 380)"/>
    <ellipse cx="800" cy="320" rx="32" ry="14" transform="rotate(20 800 320)"/>
    <ellipse cx="1140" cy="340" rx="28" ry="12" transform="rotate(-50 1140 340)"/>
    <ellipse cx="1380" cy="320" rx="30" ry="13" transform="rotate(35 1380 320)"/>
  </g>
  <!-- leaf stems (small dots) -->
  <g fill="#8B4A1E">
    <circle cx="232" cy="180" r="2"/>
    <circle cx="540" cy="160" r="2"/>
    <circle cx="932" cy="140" r="2"/>
    <circle cx="1296" cy="160" r="2"/>
  </g>

  <!-- Rake in foreground: handle angling down-right -->
  <g transform="translate(380 380) rotate(20)">
    <!-- handle -->
    <rect x="-180" y="-6" width="380" height="12" rx="6" fill="#8B4A1E"/>
    <rect x="-180" y="-6" width="60" height="12" rx="6" fill="#B5651D"/>
    <!-- head -->
    <rect x="180" y="-30" width="80" height="60" rx="6" fill="#1A1F1B"/>
    <!-- tines -->
    <g fill="#1A1F1B">
      <rect x="260" y="-26" width="3" height="52"/>
      <rect x="246" y="-26" width="3" height="52"/>
      <rect x="232" y="-26" width="3" height="52"/>
      <rect x="218" y="-26" width="3" height="52"/>
      <rect x="204" y="-26" width="3" height="52"/>
      <rect x="190" y="-26" width="3" height="52"/>
    </g>
  </g>

  <!-- Eyebrow / label -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="100" font-size="16" font-weight="700"
          fill="#B5651D" letter-spacing="3">06 — SEASONAL CLEANUP</text>
    <text x="80" y="170" font-family="'Fraunces', Georgia, serif"
          font-size="64" font-weight="700"
          fill="#1A1F1B" letter-spacing="-2">A clean slate</text>
    <text x="80" y="232" font-family="'Fraunces', Georgia, serif"
          font-size="64" font-weight="700"
          fill="#1A1F1B" letter-spacing="-2">for the season.</text>
    <text x="80" y="290" font-size="18" font-weight="500"
          fill="#1A1F1B" opacity="0.72">
      Leaf removal, bed cleanup, debris haul-off.
    </text>
    <text x="80" y="320" font-size="18" font-weight="500"
          fill="#1A1F1B" opacity="0.72">
      Spring + fall. Bagged and gone.
    </text>
  </g>
</svg>