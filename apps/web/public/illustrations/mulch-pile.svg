<?xml version="1.0" encoding="UTF-8"?>
<!--
  mulch-pile.svg — hero decoration for /services/mulching.
  Hand-drawn pile of fresh mulch with a flat-nose rake leaning against it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — fresh mulch pile with a flat-nose rake">
  <title>Mulch pile</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Ground line -->
  <line x1="40" y1="320" x2="560" y2="320" stroke="#5C4A3A"
        stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Mulch pile (organic mound, layered texture) -->
  <path d="M 140 320 Q 160 240 220 220 Q 280 200 340 220 Q 420 240 460 320 Z"
        fill="#5C4A3A" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Texture stipple on pile (organic flecks) -->
  <g fill="#1A1F1B" opacity="0.45">
    <circle cx="200" cy="270" r="2"/>
    <circle cx="230" cy="290" r="2"/>
    <circle cx="260" cy="250" r="2"/>
    <circle cx="290" cy="280" r="2"/>
    <circle cx="320" cy="240" r="2"/>
    <circle cx="350" cy="270" r="2"/>
    <circle cx="380" cy="290" r="2"/>
    <circle cx="410" cy="260" r="2"/>
    <circle cx="240" cy="305" r="2"/>
    <circle cx="310" cy="305" r="2"/>
    <circle cx="370" cy="305" r="2"/>
    <circle cx="280" cy="265" r="2"/>
    <circle cx="340" cy="295" r="2"/>
    <circle cx="220" cy="305" r="2"/>
    <circle cx="400" cy="305" r="2"/>
  </g>
  <!-- Highlight flecks (sun catching fresh mulch) -->
  <g fill="#B5651D" opacity="0.5">
    <circle cx="250" cy="240" r="1.5"/>
    <circle cx="300" cy="225" r="1.5"/>
    <circle cx="350" cy="235" r="1.5"/>
    <circle cx="280" cy="260" r="1.5"/>
    <circle cx="380" cy="265" r="1.5"/>
  </g>

  <!-- Rake (leaning against pile from the right) -->
  <g>
    <!-- Handle -->
    <line x1="460" y1="320" x2="530" y2="120" stroke="#5C4A3A"
          stroke-width="6" stroke-linecap="round"/>
    <!-- Grip -->
    <rect x="518" y="112" width="28" height="14" rx="5" fill="#B5651D"
          stroke="#1A1F1B" stroke-width="2"/>
    <!-- Rake head (flat-nose, 8 tines) -->
    <g transform="translate(450, 320) rotate(-30)">
      <rect x="-30" y="-6" width="60" height="12" fill="#8FA89B"
            stroke="#1A1F1B" stroke-width="2"/>
      <g stroke="#1A1F1B" stroke-width="2" stroke-linecap="round">
        <line x1="-25" y1="6" x2="-25" y2="14"/>
        <line x1="-15" y1="6" x2="-15" y2="14"/>
        <line x1="-5" y1="6" x2="-5" y2="14"/>
        <line x1="5" y1="6" x2="5" y2="14"/>
        <line x1="15" y1="6" x2="15" y2="14"/>
        <line x1="25" y1="6" x2="25" y2="14"/>
      </g>
    </g>
  </g>

  <!-- A few scattered mulch flakes in foreground -->
  <g fill="#5C4A3A" opacity="0.7">
    <ellipse cx="120" cy="360" rx="6" ry="2"/>
    <ellipse cx="150" cy="370" rx="5" ry="2"/>
    <ellipse cx="480" cy="360" rx="6" ry="2"/>
    <ellipse cx="510" cy="370" rx="5" ry="2"/>
    <ellipse cx="540" cy="360" rx="4" ry="2"/>
  </g>
</svg>