<?xml version="1.0" encoding="UTF-8"?>
<!--
  mower-side-profile.svg — hero decoration for /services/mowing.
  Hand-drawn side profile of a self-propelled push mower.
  600×400 viewBox matches the existing illustration kit.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     role="img" aria-label="Illustration — self-propelled push mower, side profile">
  <title>Mower — side profile</title>

  <!-- Sand surface -->
  <rect width="600" height="400" fill="#F4E8D0"/>

  <!-- Ground line -->
  <line x1="40" y1="320" x2="560" y2="320" stroke="#5C4A3A"
        stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Mower deck (rounded body) -->
  <path d="M 180 260 Q 180 220 220 220 L 380 220 Q 420 220 420 260 L 420 300 Q 420 320 400 320 L 200 320 Q 180 320 180 300 Z"
        fill="#1F4E2C" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bag (rear grass catcher) -->
  <path d="M 400 220 Q 410 200 430 200 L 470 200 Q 490 200 490 220 L 490 260 Q 490 270 480 270 L 410 270 Q 400 270 400 260 Z"
        fill="#8FA89B" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Handle (curving up from the rear) -->
  <path d="M 480 210 Q 510 180 520 130" fill="none"
        stroke="#1A1F1B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 490 210 Q 520 180 530 130" fill="none"
        stroke="#1A1F1B" stroke-width="4" stroke-linecap="round"/>
  <!-- Handle grip -->
  <rect x="510" y="120" width="30" height="14" rx="6" fill="#B5651D"/>

  <!-- Front wheel (small) -->
  <circle cx="220" cy="320" r="18" fill="#1A1F1B"/>
  <circle cx="220" cy="320" r="8" fill="#8FA89B"/>
  <!-- Rear wheel (large) -->
  <circle cx="380" cy="320" r="26" fill="#1A1F1B"/>
  <circle cx="380" cy="320" r="12" fill="#8FA89B"/>
  <!-- Wheel treads (rear) -->
  <g stroke="#5C4A3A" stroke-width="2" stroke-linecap="round">
    <line x1="380" y1="296" x2="380" y2="304"/>
    <line x1="380" y1="336" x2="380" y2="344"/>
    <line x1="356" y1="320" x2="364" y2="320"/>
    <line x1="396" y1="320" x2="404" y2="320"/>
  </g>

  <!-- Engine (top hump) -->
  <path d="M 260 220 Q 260 200 280 200 L 320 200 Q 340 200 340 220"
        fill="#B5651D" stroke="#1A1F1B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pull cord -->
  <line x1="300" y1="200" x2="300" y2="180" stroke="#1A1F1B"
        stroke-width="2" stroke-linecap="round"/>
  <circle cx="300" cy="178" r="4" fill="#E8B65A"/>

  <!-- Cut grass tufts in the foreground -->
  <g stroke="#1F4E2C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 80 360 Q 80 340 78 320"/>
    <path d="M 80 360 Q 90 340 92 320"/>
    <path d="M 80 360 Q 70 340 68 325"/>
    <path d="M 500 360 Q 500 340 498 320"/>
    <path d="M 500 360 Q 510 340 512 320"/>
    <path d="M 500 360 Q 490 340 488 325"/>
  </g>
</svg>