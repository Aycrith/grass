name: lighthouse-nightly

# Nightly full-sweep Lighthouse CI for drift monitoring.
#
# Runs all 6 PRD-00 §4 routes against the production build at a
# daily 06:00 UTC schedule. Failures are warn-only — they don't
# fail the build (the PR job handles gating). Instead, the action
# posts a comment with the day's metrics, and a failure shows up
# on the workflow run list where the steward can review.
#
# Schedule rationale: 06:00 UTC = 02:00 EST, off the peak engineering
# window. Reports land when the steward starts their day.
#
# See also: lighthouserc.nightly.cjs at repo root + the PR-budget
# lighthouse job in ci.yml.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # allow manual run from the Actions tab

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lighthouse-nightly
  cancel-in-progress: true

jobs:
  lighthouse-full:
    name: Lighthouse CI (full sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (production)
        working-directory: apps/web
        run: bun run build

      - name: Start production server
        working-directory: apps/web
        run: |
          nohup bun run start > /tmp/lh-nightly.log 2>&1 &
          echo "PID=$!"

      - name: Wait for server ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in 60s"
          cat /tmp/lh-nightly.log
          exit 1

      - name: Lighthouse CI — full sweep
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.nightly.cjs
          uploadArtifacts: true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-nightly-server-log
          path: /tmp/lh-nightly.log
