<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero placeholder (mobile) — vertical crop of the desktop scene.
  Same brand palette; emphasizes sky + lawn, no text overlay.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero placeholder (mobile) — yard at golden hour">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B65A" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F4E8D0"/>
      <stop offset="1" stop-color="#FAF6F0"/>
    </linearGradient>
    <linearGradient id="grassM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C8A4E"/>
      <stop offset="1" stop-color="#2D5A3D"/>
    </linearGradient>
    <linearGradient id="sunM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C673"/>
      <stop offset="1" stop-color="#E8B65A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hazeM" cx="0.55" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#F4E8D0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F4E8D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#skyM)"/>

  <circle cx="660" cy="700" r="320" fill="url(#sunM)"/>
  <circle cx="660" cy="700" r="95" fill="#F6C673"/>

  <!-- Palm left -->
  <g fill="#2D5A3D" opacity="0.55">
    <path d="M 80 900 Q 100 700 115 900 Z"/>
    <path d="M 115 800 Q 75 770 40 790 Q 85 780 115 800 Z"/>
    <path d="M 115 800 Q 160 765 195 785 Q 150 780 115 800 Z"/>
  </g>

  <rect x="0" y="830" width="1200" height="90" fill="#3A6B45" opacity="0.7"/>
  <g fill="#3A6B45">
    <circle cx="120" cy="830" r="46"/>
    <circle cx="240" cy="830" r="52"/>
    <circle cx="360" cy="830" r="46"/>
    <circle cx="480" cy="830" r="58"/>
    <circle cx="600" cy="830" r="50"/>
    <circle cx="720" cy="830" r="46"/>
    <circle cx="840" cy="830" r="54"/>
    <circle cx="960" cy="830" r="48"/>
    <circle cx="1080" cy="830" r="58"/>
  </g>

  <rect x="0" y="900" width="1200" height="600" fill="url(#grassM)"/>

  <g opacity="0.18" stroke="#FAF6F0" stroke-width="3" fill="none">
    <path d="M 0 1000 L 1200 980"/>
    <path d="M 0 1100 L 1200 1075"/>
    <path d="M 0 1200 L 1200 1170"/>
    <path d="M 0 1300 L 1200 1265"/>
  </g>

  <rect width="1200" height="1500" fill="url(#hazeM)"/>

  <g stroke="#1F4E2C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 60 1500 Q 70 1440 55 1400"/>
    <path d="M 130 1500 Q 142 1430 128 1380"/>
    <path d="M 200 1500 Q 190 1445 210 1395"/>
    <path d="M 1060 1500 Q 1050 1445 1068 1395"/>
    <path d="M 1130 1500 Q 1142 1435 1128 1380"/>
  </g>
</svg>